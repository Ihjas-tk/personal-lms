[project]
name = "learn"
version = "0.1.0"
description = "Local, file-first learning tracker for the LLM + evals track"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "pydantic>=2.13,<3",
    "python-frontmatter>=1.3,<2",
    "pyyaml>=6,<7",
    "watchfiles>=1.2,<2",
    "anthropic>=1.7,<2",
    "markdown-it-py>=3,<5",
]

[project.scripts]
learn = "learn.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learn"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx2>=2.13,<3",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
