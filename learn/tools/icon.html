<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Playfair Display";
    src: url("../web/node_modules/@fontsource/playfair-display/files/playfair-display-latin-600-normal.woff2") format("woff2");
    font-weight: 600;
  }
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  /* macOS icon grid: the artwork sits inside a 824px rounded square, centred. */
  .tile {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    border-radius: 184px;
    background: linear-gradient(160deg, #7B4BFF 0%, #6D3BEE 55%, #5A2ED6 100%);
    box-shadow: inset 0 -12px 40px rgba(0,0,0,.18), inset 0 12px 30px rgba(255,255,255,.14);
    display: grid; place-items: center;
  }
  .mark {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 600; font-size: 560px; line-height: 1;
    color: #ffffff; margin-top: -40px;
    text-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
</style>
</head>
<body>
  <div class="tile"><div class="mark">l</div></div>
</body>
</html>
