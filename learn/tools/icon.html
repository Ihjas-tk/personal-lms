<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  The macOS app icon, rendered to a 1024 × 1024 transparent PNG by `tools/icon.mjs`.

  The brand's app-icon spec (`docs/ux/redesign/design_handoff_learn_redesign`, § Brand):
  violet square, corner radius 23% of the square, the mark at 72% inside it in white,
  stroke 4.4 at the mark's own 64-unit box. The mark is the only thing that ever sits
  in a container, and this is that container.

  macOS wants the artwork inside an 824 px square on a 1024 px canvas, so the tile is
  824 px: radius 23% → 189.5 px, and the mark's box is 72% of 824 → 593 px. The page
  background stays transparent; `icon.mjs` screenshots with `omitBackground`.
-->
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    border-radius: 189.52px;
    background: linear-gradient(160deg, #7b4bff 0%, #6d3bee 55%, #5a2ed6 100%);
    box-shadow: inset 0 -12px 40px rgba(0, 0, 0, .18), inset 0 12px 30px rgba(255, 255, 255, .14);
    display: grid; place-items: center;
  }
  .mark { display: block; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .18)); }
  /* `?variant=stop`: the Stop app gets a red inner border so the two icons never get mixed up in the Dock. */
  .tile.stop {
    box-shadow: inset 0 0 0 52px #d93025, inset 0 -12px 40px rgba(0, 0, 0, .18);
  }
</style>
<script>
  if (new URLSearchParams(location.search).get("variant") === "stop") {
    document.addEventListener("DOMContentLoaded", () => document.querySelector(".tile").classList.add("stop"));
  }
</script>
</head>
<body>
  <div class="tile">
    <svg class="mark" width="593.28" height="593.28" viewBox="0 0 64 64" fill="none">
      <path d="M40 32 A9.5 9.5 0 0 1 21 32 A15 15 0 0 1 51 32 A20.5 20.5 0 0 1 10 32 A26 26 0 0 1 62 32"
            transform="translate(-4,2.75)" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round" />
    </svg>
  </div>
</body>
</html>
