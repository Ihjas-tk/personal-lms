    resources:
      - id: b0-eval-email-course
        title: "Hamel Husain & Shreya Shankar, free 17-part email course and two e-books"
        kind: course
        url: https://ai.hamel.dev/eval-course
        est_minutes: 420
        length: 420
        unit: min
      - id: b0-hamel-needs-evals
        title: "Hamel Husain, Your AI Product Needs Evals"
        kind: doc
        url: https://hamel.dev/blog/posts/evals/
        est_minutes: 90
      - id: b0-anthropic-success-criteria
        title: "Anthropic, Define your success criteria"
        kind: doc
        url: https://docs.anthropic.com/en/docs/build-with-claude/define-success-criteria
        est_minutes: 45
      - id: b0-anthropic-develop-tests
        title: "Anthropic, Create strong empirical evaluations"
        kind: doc
        url: https://docs.anthropic.com/en/docs/build-with-claude/develop-tests
        est_minutes: 45
    checks:
      - id: b0-rouge-tells-nothing
        module: b0
        type: explain
        must_cover: true
        prompt: "In two sentences and without notes, say why a 0.87 ROUGE-L on a summarisation feature tells a product team essentially nothing."
        rubric:
          - "Says ROUGE-L measures longest-common-subsequence overlap with one reference, i.e. surface form"
          - "Says the reference is one arbitrary acceptable summary among many, so a good summary can score low and a bad one high"
          - "Connects to the product: it is uncorrelated with the failures users actually complain about"
          - "Delivered in two sentences, not five"
          - "Does not hedge into 'it depends' without stating the conclusion"
        reference: |
          ROUGE-L scores n-gram/longest-common-subsequence overlap against one arbitrarily chosen
          reference summary, so it rewards saying the same words rather than being right — a
          faithful summary phrased differently scores low, and a fluent summary that invents a
          number scores high. That means 0.87 is a number about surface similarity to one writer's
          wording, not about whether the feature omits the thing the user needed, fabricates a
          figure, or breaks the required format, which are the failures the team will actually
          hear about.
        known_prior: false
        est_minutes: 10
        draft: true
      - id: b0-three-things-instead
        module: b0
        type: explain
        must_cover: true
        prompt: "Name the three things you would do instead of reporting a ROUGE score, in order."
        rubric:
          - "First: read traces and build a failure taxonomy by open then axial coding, before any metric"
          - "Second: write targeted binary evaluators - code-based where the criterion is objective, a calibrated judge where it is semantic"
          - "Third: report a corrected pass rate per failure mode with an interval, and gate changes on it in CI"
          - "The order is stated as load-bearing: metrics come after the taxonomy"
          - "Mentions that the judge itself must be validated against human labels"
        reference: |
          One: look at the data. Sample 100+ real traces, open-code free-form failure notes, then
          axial-code them into 5-9 failure modes with counts. That table, not a metric, is what
          tells a product team where the feature is broken. Two: write one evaluator per failure
          mode that actually matters — code-based assertions where the criterion is objective
          (format, required citation, schema, numeric tolerance) and an LLM judge where it is
          semantic, with the judge validated against human labels and its TPR/TNR reported. Three:
          report a corrected pass rate per failure mode with a confidence interval, and wire the
          suite into CI so a change that regresses a known mode fails the PR. Metrics are the
          output of error analysis, never the input.
        known_prior: false
        est_minutes: 15
        draft: true
      - id: b0-transfer-table
        module: b0
        type: explain
        must_cover: false
        prompt: "Write the transfer table from memory: for each piece of your MSc evaluation toolkit, say whether it transfers to LLM evals, and how."
        rubric:
          - "Train/val/test discipline transfers, but the test set is a curated golden set, not a random split"
          - "Precision/recall/F1 transfer to the judge, with human labels as ground truth, not to the output"
          - "Class-imbalance intuition transfers critically: failure rates of 5-15% make accuracy meaningless"
          - "Cross-validation and AUC/ROC transfer only partially; bootstrap replaces CV, and most product judgements are binary by design"
          - "BLEU/ROUGE/embedding similarity and 'pick a metric and optimise it' are marked as not transferring"
        reference: |
          | MSc toolkit | Transfers? | How |
          |---|---|---|
          | train/val/test discipline | yes | but "test" is a curated golden set you build, not a random split |
          | precision / recall / F1 | yes, for the *judge* | human labels are ground truth; TPR/TNR on the judge |
          | cross-validation | partly | golden sets are too small and too costly; bootstrap replaces CV |
          | hypothesis testing | yes | paired tests on a shared question set; McNemar for binary |
          | class-imbalance intuition | critically | failure rates are often 5-15%, so accuracy is meaningless |
          | AUC / ROC | rarely | product judgements are binary and thresholded by design |
          | BLEU / ROUGE / embedding similarity | no | surface overlap, uncorrelated with product failure |
          | "pick a metric, optimise it" | no | the habit to unlearn; metrics follow the taxonomy |
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b0-l1-l2-l3
        module: b0
        type: explain
        must_cover: false
        prompt: "State the L1 / L2 / L3 eval level model and what question each level answers."
        rubric:
          - "L1: code-based assertions written like pytest - cheap, deterministic, run on every change"
          - "L2: human and model evaluation over traces, with custom viewers and judge-to-human alignment"
          - "L3: A/B tests on real traffic measuring business outcomes"
          - "States that the levels are cumulative and that most teams skip L1 and over-invest in L2 dashboards"
          - "Names the question each answers: did I break a known behaviour / is the quality what I think / does it move the business metric"
        reference: |
          L1 is assertions you would write in pytest: schema validity, required citation present,
          no forbidden string, latency under a bound, tool arguments well-typed. They are free,
          deterministic, and run on every change; their question is "did this break a known
          behaviour?". L2 is human and model evaluation over real traces: a custom viewer, binary
          labels with written critiques, and an LLM judge aligned to those labels and measured
          against a held-out human set. Its question is "is quality what I think it is?". L3 is
          A/B testing on real traffic with a primary metric and pre-registered guardrails; its
          question is "does this move the business outcome?". The levels are cumulative, and the
          common failure is skipping L1 entirely and buying an L2 dashboard whose judges were
          never validated.
        known_prior: false
        est_minutes: 15
        draft: true

