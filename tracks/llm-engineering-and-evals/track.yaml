        kind: doc
        url: https://modelcontextprotocol.io/specification/2026-07-28/changelog
        est_minutes: 540
      - id: a7-anthropic-code-execution-mcp
        title: "Anthropic, Code execution with MCP: building more efficient agents"
        kind: doc
        url: https://www.anthropic.com/engineering/code-execution-with-mcp
        est_minutes: 120
      - id: a7-claude-agent-sdk
        title: "Claude Agent SDK docs"
        kind: doc
        url: https://docs.claude.com/en/docs/agent-sdk/
        est_minutes: 540
    checks:
      - id: a7-multiagent-position
        module: a7
        type: judge
        must_cover: true
        prompt: "Argue both sides of the multi-agent question and state your own position with a concrete decision rule."
        rubric:
          - "The pro case stated fairly: parallel context isolation, more total reading, specialisation, Anthropic's research-system result"
          - "The con case stated fairly: dispersed decision-making, context not shared thoroughly, conflicting implicit decisions (Cognition)"
          - "The 2026 synthesis named: multiple agents may contribute intelligence, but writes stay single-threaded"
          - "A decision rule you could apply to a new system, with a threshold or a test, not a preference"
          - "The learner's own position stated, not a summary of others'"
        reference: |
          **For.** Sub-agents get their own context window, so a research task that would blow one
          window can read far more in parallel; specialisation lets each sub-agent carry a smaller,
          sharper prompt; Anthropic's multi-agent research system reports real gains on
          breadth-first search tasks.

          **Against.** Cognition's argument is that decisions get dispersed: sub-agents make
          implicit choices their siblings never see, context is not shared thoroughly, and the
          conflicting choices surface as incoherent output. Debugging is far harder and token cost
          multiplies.

          **Synthesis (2026).** Both converge on the same rule: context engineering is the whole
          game, so **parallelise reads, serialise writes**.

          **My decision rule.** Use multiple agents only when (a) the sub-tasks are read-only,
          (b) their results can be merged by a single coordinator that owns all writes, and (c) a
          single agent has been measured and is context-bound rather than reasoning-bound. If any
          write happens off the main thread, it is one agent.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a7-classify-process
        module: a7
        type: judge
        must_cover: true
        prompt: "Take a business process and classify it as no-LLM, a workflow, a single agent, or multi-agent, and defend the classification."
        rubric:
          - "The classification ladder is applied in order, cheapest first, and the test for each rung is stated"
          - "No-LLM is a live option and is chosen at least once for an appropriate process"
          - "Workflow vs agent turns on whether the control flow is known in advance"
          - "The defence cites the cost, latency and failure-containment consequences, not elegance"
          - "Names at least one process that looks agentic but is a deterministic pipeline"
        reference: |
          Apply the ladder in order and stop at the first rung that works.

          **No LLM** if the task is deterministic, high-volume or safety-critical: lithology from
          logs (GBM), decline-curve forecasting (Arps/ARIMA), sensor anomaly detection (classical
          time series). The LLM may write the explanation; it must not make the detection.

          **Workflow** if the control flow is known in advance: extract fields from a PDF, validate
          against a schema, write a row. Prompt chaining, routing, parallelisation and
          evaluator-optimiser are all workflows. A workflow is cheaper, faster, and its failures
          are localisable.

          **Single agent** if the steps depend on intermediate results and the task needs tools:
          "answer this question using the report index and the production database" — the agent
          decides how many lookups to make.

          **Multi-agent** only when the reads are genuinely parallel and one coordinator owns
          every write.

          The common error is classifying document extraction as an agent because it involves an
          LLM; it is a workflow, and treating it as an agent buys nondeterminism for nothing.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a7-ship-agent
        module: a7
        type: code
        must_cover: true
        prompt: "Ship a single agent with five or more tools that completes a multi-step task reliably, with retries, a turn budget and an approval gate on writes."
        rubric:
          - "Five or more real tools, each with a description that a model uses correctly, and at least one write tool"
          - "A turn budget that terminates the loop, with the behaviour on exhaustion defined (not a silent stop)"
          - "Retries with backoff on transient tool errors, and distinct handling for permanent errors"
          - "An approval gate that blocks every irreversible action until confirmed, enforced outside the model"
          - "A trace showing one full successful run and one run where the gate fired"
        reference: |
          ```python
          WRITE_TOOLS = {"write_note", "update_row"}

          def run(task: str, max_turns: int = 12):
              messages = [{"role": "user", "content": task}]
              for turn in range(max_turns):
                  resp = call_model(messages, tools=TOOLS)
                  if resp.stop_reason != "tool_use":
                      return resp.text
                  for call in resp.tool_calls:
                      if call.name in WRITE_TOOLS and not approve(call):   # outside the model
                          result = {"error": "denied by approval gate", "terminal": True}
                      else:
                          result = invoke_with_retry(call, attempts=3, backoff=2.0)
                      messages.append(tool_result(call, result))
              raise TurnBudgetExceeded(f"no final answer in {max_turns} turns")
          ```

          Three details that make it real rather than a demo: the turn budget raises rather than
          returning a plausible half-answer; `invoke_with_retry` retries only transient failures
          (timeouts, 429, 5xx) and surfaces permanent ones to the model so it can adapt; and
          `approve` is a host-side function the model cannot call, argue with, or bypass — the gate
          is architecture, not instruction.
        known_prior: false
        est_minutes: 45
        draft: true
      - id: a7-mcp-server
        module: a7
        type: code
        must_cover: true
        prompt: "Write an MCP server against the 2026-07-28 spec and connect a client to it."
        rubric:
          - "The server implements the stateless protocol core, with no reliance on the removed session model"
          - "List results are cacheable and the caching semantics are honoured"
          - "Authorization follows the hardened rules (issuer validation, issuer-bound client credentials or CIMD) where auth is used"
          - "At least one tool with a schema and a description written for a model, not for a human"
          - "A client connects, lists tools, and invokes one end to end, with the transcript shown"
        reference: |
          The shape to aim for, with the 2026-07-28 core in mind: no server-side session state, so
          every request carries what it needs and can be routed by headers; `tools/list` responses
          are cacheable, so clients are not forced to re-enumerate; and authorization validates the
          issuer and binds client credentials to it.

          ```python
          # server: one tool, no session state held between requests
          from mcp.server.fastmcp import FastMCP

          mcp = FastMCP("sodir-reports")

          @mcp.tool()
          def find_report(wellbore_id: str) -> dict:
              """Return the end-of-well report metadata for a Sodir wellbore id
              (e.g. '6506/3-1'). Returns {} when the wellbore has no public report.
              This does NOT search report text - use search_reports for that."""
              return REPORT_INDEX.get(wellbore_id, {})

          if __name__ == "__main__":
              mcp.run()
          ```

          Verify with a client: list tools, check the list response's cache headers, call the tool,
          and paste the transcript into the repo. Treat any tutorial written before August 2026 as
          teaching the removed stateful model.
        known_prior: false
        est_minutes: 45
        draft: true
      - id: a7-mcp-spec-delta
        module: a7
        type: explain
        must_cover: true
        prompt: "Explain what changed in MCP at the 2026-07-28 revision relative to the stateful model, and what breaks in older tutorials."
        rubric:
          - "Stateless protocol core: the session model was removed via six SEPs"
          - "Multi round-trip requests, header-based routing, cacheable list results"
          - "Authorization hardening: issuer validation, issuer-bound client credentials, Client ID Metadata Documents"
          - "A formal extensions framework and a 12-month deprecation lifecycle"
          - "States the practical consequence: pre-August-2026 tutorials teach session initialisation and handles that no longer exist"
        reference: |
          The 2026-07-28 revision is the largest since launch. The protocol core became stateless:
          the session model was removed across six SEPs, so servers no longer hold per-client state
          between requests and can be scaled and load-balanced like ordinary HTTP services. In its
          place came multi round-trip requests, header-based routing so a proxy can direct traffic
          without parsing bodies, and cacheable list results so clients stop re-enumerating tools on
          every connection. Authorization was hardened: issuers must be validated, client
          credentials are bound to their issuer, and Client ID Metadata Documents replace ad-hoc
          registration. A formal extensions framework and a 12-month deprecation lifecycle were
          added. The practical consequence is that any tutorial written before August 2026 opens
          with session initialisation and a session handle that no longer exists, so its first code
          block is wrong even when its concepts are right.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a7-tool-design-rationale
        module: a7
        type: explain
        must_cover: true
        prompt: "Explain why your tool descriptions and signatures look the way they do, citing specific failures you observed."
        rubric:
          - "At least three design decisions, each traced to an observed failure with a quoted trace"
          - "Covers granularity: why tools were merged or split after watching the model misuse them"
          - "Covers return shape: compact, model-readable results rather than raw dumps, with the token consequence stated"
          - "Covers error messages: errors written to tell the model what to do next"
          - "Notes the standing token cost of descriptions and how tool-search or code execution mitigates a large tool set"
        reference: |
          Three decisions and the traces behind each. First, `search_reports` and `get_report_page`
          were originally one `read_report(query)` tool; the model kept asking for whole reports and
          blowing the window, so it was split and the page tool capped at one page. Second, the
          SQL tool returns `{"rows": [...], "row_count": n, "truncated": bool}` capped at 50 rows
          instead of the full result set, after a trace where a 4,000-row answer consumed 60k
          tokens and the agent then had nothing left to reason with. Third, error strings are
          instructions: `"no wellbore matches '6506/3'; ids include a hyphenated suffix, e.g.
          '6506/3-1'"` replaced a bare `KeyError`, and the retry rate on that class went to near
          zero. Descriptions are re-sent every turn, so a large tool set is served by tool search
          or by the code-execution pattern rather than by pasting fifty schemas into context.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a7-least-privilege
        module: a7
        type: explain
        must_cover: false
        prompt: "Design the permission model for your agent: least privilege per tool, the approval surface, and the audit trail."
        rubric:
          - "Each tool has an explicitly scoped credential, with read and write separated"
          - "Irreversible actions require approval, and the approval is enforced by the host, not by the prompt"
          - "The blast radius of a fully compromised agent is stated explicitly"
          - "An audit trail records what the agent actually did, sufficient to answer that question after the fact"
          - "Connects to OWASP 2026 moving excessive agency from LLM06 to LLM03"
        reference: |
          Scope each tool to the narrowest credential that lets it work: the retriever gets a
          read-only database role, the SQL tool gets a read-only role on a specific schema with a
          statement timeout and a row cap, and the one write tool gets a role that can insert into
          exactly one table. No tool shares a credential. Every irreversible action — writes,
          sends, deletes, spends — passes through a host-side approval function the model cannot
          call or reason with; a prompt instruction is not a control, because prompt injection
          changes prompts. Then write down the blast radius honestly: "an agent fully controlled by
          an attacker can read any public Sodir document and insert one row into `notes`; it cannot
          delete, cannot reach the internet, and cannot spend money." Log every tool call with
          arguments, result hash, approval decision and timestamp. OWASP moved excessive agency
          from LLM06 to LLM03 in 2026 precisely because this is where production incidents cluster.
        known_prior: false
        est_minutes: 25
        draft: true

