        est_minutes: 45
      - id: b6-anthropic-why-build-evals
        title: "Anthropic, Demystifying evals for AI agents (why build evaluations; the Swiss cheese model)"
        kind: doc
        url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
        est_minutes: 60
    checks:
      - id: b6-ci-gate
        module: b6
        type: code
        must_cover: true
        prompt: "Show a green CI run where the eval suite gates a PR, and a deliberately broken PR where the gate fires."
        rubric:
          - "The suite runs on every PR, completes in under ten minutes, and its result is a required status check"
          - "Model calls are cached or stubbed so the run is affordable and not flaky on network"
          - "The gate is a threshold on the eval, with the threshold stated and justified, not 'all tests pass'"
          - "Both runs are shown: green on a good PR, red on a PR that deliberately regresses a known failure mode"
          - "The failing run's output names which failure mode regressed, not just a number"
        reference: |
          ```yaml
          # .github/workflows/evals.yml
          name: evals
          on: [pull_request]
          jobs:
            offline-suite:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v4
                - run: uv run python -m evals.run --suite regression --cache .evalcache
                - run: uv run python -m evals.gate --baseline main --max-regression 0.03
          ```

          `gate` exits non-zero when any per-failure-mode pass rate drops more than 3 points below
          the baseline run on `main`, and prints the offending modes:

          ```
          FAIL  mode "wrong page cited"  main 0.88 -> pr 0.71  (-0.17)
          PASS  mode "unanswerable answered"  main 0.92 -> pr 0.93
          ```

          Keep the suite to 50-200 cases so it finishes inside ten minutes, cache model responses
          keyed on (case id, prompt version, model), and make the check required in branch
          protection — a gate nobody has to pass is a report, not a gate.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b6-diff-report
        module: b6
        type: code
        must_cover: true
        prompt: "Produce a diff report between two model versions with per-failure-mode deltas."
        rubric:
          - "Both runs use the identical dataset version, scorers and harness commit; only the model differs"
          - "Deltas reported per failure mode, not only in aggregate"
          - "Paired analysis: which specific cases flipped each way, listed by case id"
          - "An interval or test accompanies the aggregate delta, not a bare difference of two point estimates"
          - "The report is generated by the harness, not assembled by hand"
        reference: |
          ```
          diff  baseline=run-2026-12-01 (model-a)   candidate=run-2026-12-02 (model-b)
          dataset golden-v1.2.0   harness 9f31c0a   scorers unchanged

          overall        0.812 -> 0.846   +0.034   McNemar b=17 c=8, p=0.108
          by failure mode
            wrong page cited          0.88 -> 0.93   +0.05
            unanswerable answered     0.92 -> 0.79   -0.13   <-- regression
            dropped qualifier         0.74 -> 0.82   +0.08
          flipped pass->fail (8): gs-0031 gs-0044 gs-0077 ...
          flipped fail->pass (17): gs-0002 gs-0019 ...
          ```

          The aggregate improvement hides a real regression in abstention, which is why the
          per-mode table is the deliverable and the headline number is not. Because both models saw
          the same cases, the comparison is paired: report McNemar on the discordant pairs rather
          than two independent proportions. Always list the flipped case ids — reading ten of them
          is what turns a number into a decision.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b6-swap-runbook
        module: b6
        type: explain
        must_cover: true
        prompt: "Hand over a one-page model-swap requalification runbook."
        rubric:
          - "Ordered steps: full offline suite on both models, paired comparison with CIs, judge re-calibration on the NEW model's outputs, shadow/canary, A/B with pre-registered guardrails"
          - "States why the judge must be re-calibrated: a judge calibrated on model A is not calibrated for model B"
          - "Names the guardrail metrics and their thresholds before the test runs"
          - "Includes a rollback trigger and who decides"
          - "Fits on one page and names the artefacts produced at each step"
        reference: |
          **Model-swap requalification runbook**

          1. **Freeze** dataset version, scorers, prompts and harness SHA. Only the model changes.
          2. **Offline suite, both models**, same cases. Artefact: diff report with per-failure-mode
             deltas and flipped case ids.
          3. **Paired comparison.** McNemar on the discordant pairs; bootstrap CI on the delta,
             clustered by document. Artefact: one table.
          4. **Re-calibrate the judge on the new model's outputs.** A judge's TPR/TNR are measured
             against a distribution of outputs; model B writes differently (length, hedging,
             formatting), so old TPR/TNR do not transfer. Label ~100 fresh model-B outputs.
             Artefact: new confusion matrix; re-corrected pass rates for both models.
          5. **Read 20 transcripts** — 10 worst, 10 flipped. Artefact: written notes.
          6. **Shadow then canary** at 5%, with pre-registered guardrails: p95 latency < 4 s,
             cost/request < $0.05, refusal rate within ±2 pts, zero safety violations.
          7. **A/B** on the business metric if one exists.
          8. **Rollback trigger**: any guardrail breached, or any failure mode down > 5 points.
             Decision owner named. Artefact: ship / don't-ship memo.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b6-four-way-distinction
        module: b6
        type: explain
        must_cover: false
        prompt: "State the four-way distinction between offline evals, online evals, guardrails and A/B tests, with the question each answers and its latency budget."
        rubric:
          - "Offline: every PR or model change; did this break a known behaviour; minutes in CI"
          - "Online: continuously on sampled production traffic; are novel failures appearing; async and sampled"
          - "Guardrail: synchronously in the request path; should this output be blocked or escalated; milliseconds"
          - "A/B: deliberate traffic split; does variant B move the business metric; days to weeks"
          - "Names both traps: calling a guardrail an eval, and calling an online eval an A/B test"
        reference: |
          | | runs when | question | latency budget |
          |---|---|---|---|
          | offline evals | every PR / model change | did this change break a known behaviour? | minutes (CI) |
          | online evals | continuously, sampled prod traffic | are novel failures appearing that my suite misses? | async, sampled |
          | guardrails | synchronously, in the request path | should this specific output be blocked, transformed or escalated? | milliseconds |
          | A/B test | on a deliberate traffic split | does variant B move the business metric? | days to weeks |

          The first trap is calling a guardrail an eval: a guardrail must return before the user
          sees output, so it must be cheap and can never be a slow multi-step judge — and its pass
          rate is not a quality measurement, it is a block rate. The second trap is calling an
          online eval an A/B test: online evals score quality on traffic you already serve; A/B
          tests measure business outcomes on split traffic with a control.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b6-guardrail-not-eval
        module: b6
        type: judge
        must_cover: false
        prompt: "Given a list of proposed checks, classify each as a guardrail, an offline eval, an online eval or an A/B metric, and defend the hard cases."
        rubric:
          - "Each check classified with a one-line reason tied to latency budget and to the question it answers"
          - "Hard cases surfaced: a check that could be both a guardrail and an offline eval, and how the same scorer serves both"
          - "States the same-scorer principle: write the rubric once, run it in both places, so divergence is a signal"
          - "Notes which checks cannot be guardrails because they are too slow"
          - "Notes which cannot be A/B metrics because they are not business outcomes"
        reference: |
          | check | classification | why |
          |---|---|---|
          | output is valid JSON | guardrail **and** offline eval | deterministic and sub-ms; same function both places |
          | cited page resolves to a real page | guardrail and offline eval | a lookup; cheap enough for the request path |
          | cited page supports the claim (judge) | offline + online eval, **not** a guardrail | a multi-second LLM call cannot sit in the request path |
          | refusal rate | online eval + A/B guardrail metric | a rate, not a per-output decision |
          | engineer opens the source PDF after answering | A/B metric only | a business outcome, unavailable offline |
          | p95 latency | guardrail metric + A/B guardrail | measured, not judged |

          The principle that makes the table useful: write each rubric once and run the same
          scorer offline against the golden set and online against sampled traffic. When the two
          diverge, the divergence itself is the regression signal — which is impossible if the
          offline and online implementations differ.
        known_prior: false
        est_minutes: 25
        draft: true
  - id: a7
