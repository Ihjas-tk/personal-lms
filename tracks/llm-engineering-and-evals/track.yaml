      - id: b3-eugene-yan-llm-evaluators
        title: "Eugene Yan, Evaluating the Effectiveness of LLM-Evaluators"
        kind: doc
        url: https://eugeneyan.com/writing/llm-evaluators/
        est_minutes: 120
      - id: b3-same-model-judge
        title: "Evals FAQ: Can I use the same model for both the main task and evaluation?"
        kind: doc
        url: https://hamel.dev/blog/posts/evals-faq/can-i-use-the-same-model-for-both-the-main-task-and-evaluation.html
        est_minutes: 30
    checks:
      - id: b3-judge-prompt
        module: b3
        type: code
        must_cover: true
        prompt: "Ship a judge with a documented prompt built by Critique Shadowing, with its version history."
        rubric:
          - "The prompt states one binary criterion, with the pass condition and named edge cases from the annotation guideline"
          - "It requires a written critique before the verdict, and returns a structured verdict field"
          - "Few-shot examples are real labelled traces, including near-miss negatives"
          - "The prompt is versioned in git and every eval run records which version produced its scores"
          - "The prompt was iterated against the dev split only; the held-out split was not consulted"
        reference: |
          ```python
          JUDGE_PROMPT_V3 = """You are grading one answer from a well-report QA system.

          CRITERION (binary): PASS if every factual claim in the answer is supported by the
          cited page of the cited report, and no qualifier present in the source is dropped.
          Otherwise FAIL.

          Edge cases:
          - Correct fact, wrong page  -> FAIL
          - Correct refusal when the report does not state it -> PASS
          - Extra true but uncited claim -> FAIL

          Write a two-sentence critique FIRST, quoting the specific claim you checked, then
          the verdict.

          <question>{question}</question>
          <cited_page_text>{page_text}</cited_page_text>
          <answer>{answer}</answer>

          Return JSON: {{"critique": str, "verdict": "PASS" | "FAIL"}}"""
          ```

          Critique-before-verdict is load-bearing: it forces the judge to name the evidence, and
          those critiques are what you read when TPR is low. Keep `judge_prompt_version` on every
          result row. Iterate against the dev split; the held-out split is touched once per
          version.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b3-tpr-tnr
        module: b3
        type: numeric
        must_cover: true
        prompt: "Report your judge's TPR and TNR on a held-out human-labelled set, and explain why accuracy would have misled you."
        rubric:
          - "TPR = TP/(TP+FN) and TNR = TN/(TN+FP) computed from the confusion matrix, with the matrix shown"
          - "Both reported with intervals, on the held-out split only"
          - "Shows the arithmetic by which accuracy flatters a judge on an imbalanced set"
          - "States the base rate of failures in the set, because TPR/TNR are the only base-rate-free summary"
          - "States the deployment rule: a judge with TPR + TNR <= 1 is worse than chance and cannot be corrected"
        reference: |
          Held-out set of 100, true pass rate 85%:

          ```
                        judge PASS   judge FAIL
          human PASS         80            5        (85 actual passes)
          human FAIL          4           11        (15 actual failures)

          TPR (sensitivity) = 80 / 85 = 0.941
          TNR (specificity) = 11 / 15 = 0.733
          accuracy          = 91 / 100 = 0.91
          ```

          Accuracy of 0.91 looks excellent and is almost entirely carried by the majority class:
          a judge that said PASS unconditionally would score 0.85. TNR of 0.733 is the number that
          matters, because it says the judge misses about a quarter of real failures — and failures
          are what evals exist to find. Report both with Wilson intervals (TNR here is
          11/15 = 0.733, 95% CI roughly [0.48, 0.89] — wide, because 15 negatives is a small
          calibration base). Rogan-Gladen requires TPR + TNR > 1; here 1.67, so the correction is
          valid.
        known_prior: true
        est_minutes: 30
        draft: true
      - id: b3-position-bias
        module: b3
        type: code
        must_cover: true
        prompt: "Run a position-bias check on your judge: does swapping the order of the two candidates change the verdict?"
        rubric:
          - "Every pairwise comparison is run in both orders on the same items"
          - "The disagreement rate between orders is reported as the bias figure"
          - "The direction of the bias is reported (which position is favoured)"
          - "A mitigation is applied and re-measured: order randomisation, both-orders-and-require-agreement, or reference-guided grading"
          - "Notes that a single-output (non-pairwise) judge is not exempt; check ordering of rubric items and of retrieved context"
        reference: |
          ```python
          def position_bias(pairs, judge):
              flips = 0
              prefer_first = 0
              for a, b in pairs:
                  v1 = judge(first=a, second=b)     # "A" or "B"
                  v2 = judge(first=b, second=a)     # swapped
                  # consistent means v1 and v2 name the same candidate
                  if (v1 == "A") == (v2 == "A"):    # same POSITION won twice -> inconsistent
                      flips += 1
                      prefer_first += (v1 == "A")
              return flips / len(pairs), prefer_first / max(flips, 1)

          rate, first_share = position_bias(PAIRS, judge)
          print(f"order-disagreement {rate:.2%}, of which {first_share:.0%} favour position 1")
          ```

          A disagreement rate above roughly 10% means the judge is partly grading position rather
          than content. Mitigations, in order of cost: randomise order and report it; run both
          orders and count only agreeing verdicts (discarding the rest as ties); or switch to
          reference-guided grading, where each candidate is graded independently against a
          reference instead of against the other. Re-measure after the mitigation — do not assume
          it worked.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b3-verbosity-bias
        module: b3
        type: code
        must_cover: true
        prompt: "Run a verbosity-bias check on your judge: does answer length correlate with a PASS verdict once correctness is controlled for?"
        rubric:
          - "Length measured in tokens, not characters or words"
          - "Correlation reported between length and verdict on items with the same human label, so correctness is held fixed"
          - "A manipulation check: pad a correct answer with true but irrelevant sentences and see if the verdict or score moves"
          - "A mitigation stated: length-matched few-shot examples, an explicit instruction that length is not a criterion, or a length covariate in the analysis"
          - "Reports the effect size, not just 'no bias observed'"
        reference: |
          ```python
          import numpy as np
          from scipy.stats import pointbiserialr

          # hold correctness fixed: only rows the HUMAN marked PASS
          rows = [r for r in heldout if r.human == "PASS"]
          lens = np.array([count_tokens(r.answer) for r in rows])
          judged = np.array([r.judge == "PASS" for r in rows], dtype=float)
          r, p = pointbiserialr(judged, lens)
          print(f"length-verdict r = {r:.3f} (p = {p:.3f}) among human-PASS items")

          # manipulation check: pad with true-but-irrelevant sentences
          padded = [pad_with_true_filler(r.answer, n_sentences=4) for r in rows]
          flip_rate = np.mean([judge(r.q, p) != judge(r.q, r.answer)
                               for r, p in zip(rows, padded)])
          print(f"verdict flip rate under padding: {flip_rate:.2%}")
          ```

          Reporting `r` among items of identical human label is what separates verbosity bias from
          the real correlation (longer answers often are more complete). A flip rate above a few
          percent under pure padding is the clean evidence. Mitigate with length-matched few-shot
          examples and an explicit "length is not a criterion" line, then re-measure.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b3-rogan-gladen-ci
        module: b3
        type: numeric
        must_cover: true
        prompt: "Report a corrected system pass rate with a bootstrap 95% CI, given the judge's raw pass rate on unlabelled traces and its TPR/TNR on a held-out calibration set."
        rubric:
          - "Applies theta_hat = (p_obs + TNR - 1) / (TPR + TNR - 1) and shows the substitution"
          - "Checks the validity condition TPR + TNR > 1 before applying it"
          - "Bootstraps over BOTH the calibration set and the unlabelled test set, not just one"
          - "Reports the interval and notes it is wider than the naive binomial interval on p_obs, and why"
          - "Clips or flags estimates that fall outside [0, 1]"
        reference: |
          With `p_obs = 0.90` on 500 unlabelled traces, `TPR = 0.941`, `TNR = 0.733`:

          ```
          TPR + TNR = 1.674 > 1                     (valid)
          theta_hat = (0.90 + 0.733 - 1) / (1.674 - 1)
                    = 0.633 / 0.674
                    = 0.939
          ```

          The judge understates the pass rate here because its TNR is poor relative to its TPR.

          ```python
          import numpy as np
          from judgy import estimate_success_rate

          theta, lo, hi = estimate_success_rate(
              human_labels=cal_human,              # held-out calibration labels
              judge_preds_on_labeled=cal_judge,    # judge on the same items
              judge_preds_on_unlabeled=prod_judge, # judge on the 500 traces
          )
          print(f"{theta:.3f}  95% CI [{lo:.3f}, {hi:.3f}]")   # e.g. 0.939 [0.881, 0.983]
          ```

          Each bootstrap replicate resamples the calibration set (giving new TPR/TNR) *and* the
          unlabelled set (giving a new p_obs), then recomputes theta. The interval is much wider
          than the naive Wilson interval on 0.90 of 500 (about ±0.026) because a 100-example
          calibration set with only 15 negatives estimates TNR very imprecisely, and that
          imprecision propagates through the denominator. Flag any replicate falling outside
          [0, 1] rather than silently clipping.
        known_prior: true
        est_minutes: 35
        draft: true
      - id: b3-explain-to-pm
        module: b3
        type: explain
        must_cover: true
        prompt: "Explain to a PM in plain English why the corrected pass rate differs from the raw judge number."
        rubric:
          - "No formula and no jargon: no TPR, TNR, or Rogan-Gladen without a plain-English gloss"
          - "Uses the diagnostic-test analogy: an imperfect test's positive rate is not the disease rate"
          - "States the direction of the correction for this system and why"
          - "States the interval in decision terms: what range the true number could be in, and what that changes"
          - "Names what would tighten it: more human labels, especially of the rare class"
        reference: |
          Our automatic grader agrees with a human most of the time, but not always — and
          importantly, it is better at recognising good answers than bad ones. It catches about 19
          in 20 good answers, but only about 3 in 4 bad ones. So when it reports "90% of answers
          passed", part of that 90% is answers it waved through that a person would have failed,
          and part of the missing 10% is good answers it wrongly flagged. Correcting for both
          tendencies gives about 94%. It is the same logic as a medical test: if a test has a
          known false-positive rate, the share of positive results is not the share of people with
          the disease. The honest version is "94%, somewhere between 88% and 98%". That range is
          wide because we only have 100 human-labelled examples, and only 15 of them are failures.
          Labelling more failures is what narrows it.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b3-code-vs-judge-vs-human
        module: b3
        type: judge
        must_cover: false
        prompt: "Route each criterion in your system to code, model or human grading, and defend the routing as a one-pager."
        rubric:
          - "Code for objectively checkable criteria: schema, regex/format, citation present, tool-arg types, numeric tolerance, latency, cost"
          - "Judge for semantic criteria, and only where at least ~100 human labels exist to calibrate against"
          - "Human for the golden set, judge calibration, periodic re-calibration, and anything genuinely novel"
          - "Trade-offs stated for each: brittleness, non-determinism and cost, speed and expense"
          - "States the two nevers: never deploy an uncalibrated judge, never report a raw judge rate as the system's rate"
        reference: |
          | criterion | grader | why |
          |---|---|---|
          | answer is valid JSON against schema | code | objective, free, deterministic |
          | a citation is present and the page resolves | code | objective; a regex plus a lookup |
          | the cited page actually supports the claim | judge | semantic; ~100 labels exist |
          | tone appropriate for a drilling engineer | judge | semantic, low stakes |
          | p95 latency under 4 s, cost under $0.05 | code | measured, not judged |
          | is this a new failure mode? | human | novel by definition |
          | the golden set labels themselves | human | the ground truth everything else is measured against |

          Code is fast, free and deterministic but brittle to valid variation — a correct answer in
          an unexpected format fails. Judges are flexible and scale but are non-deterministic,
          cost tokens, and carry their own error, which is exactly why they must be calibrated.
          Humans are the gold standard and the bottleneck. Two rules with no exceptions: never
          deploy a judge whose TPR/TNR you have not measured, and never report a raw judge pass
          rate as the system's pass rate.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: b3-critique-shadowing
        module: b3
        type: explain
        must_cover: false
        prompt: "Describe the Critique Shadowing method end to end and say what each step exists to prevent."
        rubric:
          - "Names the Principal Domain Expert as a single ground-truth oracle and says why (consistency over coverage)"
          - "Diverse dataset, then binary judgements with written critiques by the expert"
          - "Fix obvious system errors found during labelling before iterating the judge"
          - "Iterate the judge prompt against the expert's critiques until agreement is acceptable, on the dev split only"
          - "Error analysis on the remaining disagreements, then specialised judges rather than one general judge"
        reference: |
          Step one: find a Principal Domain Expert and make them the single oracle — this avoids
          averaging away disagreement and buys consistency at the cost of coverage. Step two:
          assemble a diverse dataset spanning the input distribution, so the judge is not tuned on
          one query type. Step three: the expert produces binary pass/fail with a written critique
          for every item; the critique text is the raw material for the judge prompt and prevents a
          rubric that only exists in someone's head. Step four: fix the obvious system bugs the
          labelling surfaces before touching the judge, so you are not calibrating a judge against
          a system you are about to change. Step five: iterate the judge prompt against the
          expert's critiques on the dev split only. Step six: error-analyse the remaining
          judge-human disagreements. Step seven: split into specialised judges per criterion rather
          than stretching one judge across everything.
        known_prior: false
        est_minutes: 20
        draft: true
  - id: b4
