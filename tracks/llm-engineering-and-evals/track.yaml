    checks:
      - id: p0-stack-distinction
        module: p0-orient
        type: explain
        must_cover: true
        prompt: "Without notes, explain to a colleague the difference between pretraining, SFT, RLHF and inference-time scaling."
        rubric:
          - "Pretraining: next-token prediction on a large unlabelled corpus; produces a base model with no instruction-following habit"
          - "SFT: supervised imitation of curated demonstrations; cheap relative to pretraining and changes format and behaviour, not knowledge"
          - "RLHF/RLVR: optimises a reward (preference model, or a verifiable checker) rather than imitating tokens; GRPO/PPO/DPO named as families"
          - "Inference-time scaling: no weight update at all; spends tokens at generation time (longer chains, sampling, verifiers)"
          - "Says which stage each is a lever for: knowledge, format, preference, per-request quality"
        reference: |
          Pretraining is next-token prediction over trillions of tokens of unlabelled text. It is
          where essentially all the model's knowledge and most of the compute go, and it produces a
          base model that continues text rather than answering. SFT is supervised fine-tuning on
          curated prompt/response demonstrations: it is orders of magnitude cheaper and changes
          behaviour and format, not knowledge. RLHF (and its 2025-26 successor, RL from verifiable
          rewards) optimises a reward signal instead of imitating tokens — a preference model, or a
          checker that can grade an answer — using PPO, DPO or GRPO; this is where refusal
          behaviour, helpfulness and reasoning habits get shaped. Inference-time scaling updates no
          weights at all: it spends more tokens per request on longer chains of thought, sampling
          with a verifier, or tool calls, buying quality with latency and cost.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: p0-stage-costs
        module: p0-orient
        type: numeric
        must_cover: true
        prompt: "Estimate the order-of-magnitude cost of each stage — pretraining, SFT, RLHF and inference-time scaling — for a 7-8B-class model you might actually train, and state the unit for each."
        rubric:
          - "Uses C = 6 * N * D for pretraining FLOPs and converts to GPU-hours with a stated MFU"
          - "Pretraining quoted in tens to hundreds of thousands of dollars for a 7-8B model; nanochat speedrun quoted as the ~$50 toy anchor"
          - "SFT and LoRA quoted in tens to low hundreds of dollars (single GPU, hours)"
          - "RL stage quoted as several times SFT because of rollouts, not because of gradient steps"
          - "Inference-time scaling quoted per request in dollars per 1k requests, not as a one-off"
        reference: |
          Use `C ≈ 6ND` FLOPs, N parameters, D tokens.

          A 7B model on 1.5T tokens: `C = 6 × 7e9 × 1.5e12 ≈ 6.3e22` FLOPs.
          An H100 at ~4e14 FLOP/s dense bf16 and 40% MFU delivers ~1.6e14 FLOP/s effective, so
          `6.3e22 / 1.6e14 ≈ 3.9e8` GPU-seconds ≈ **110,000 H100-hours**. At $2/hour that is
          **~$220,000**. Karpathy's nanochat speedrun is the same arithmetic at ~1/4000 the scale:
          ~$48 on an 8xH100 node for ~2 hours.

          SFT on 50k examples is ~1e18-1e19 FLOPs — **single-GPU, hours, tens of dollars**; QLoRA
          less again. An RL stage costs several times SFT because each step needs rollouts (many
          forward passes per gradient step), not because the gradients are dearer.

          Inference-time scaling is a per-request cost: a reasoning model emitting 4k thinking
          tokens at $15/M output tokens is $0.06/request, i.e. **$60 per 1k requests** — quote it in
          $/1k requests, never as a one-off.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: p0-env-ready
        module: p0-orient
        type: code
        must_cover: false
        prompt: "Show a repo migrated to uv and ruff, a rented-GPU account you have actually launched a machine from, and a self-hosted Langfuse you can send a trace to."
        rubric:
          - "pyproject.toml with a uv lockfile committed; `uv run` works from a clean checkout"
          - "ruff configured in pyproject.toml and passing (`ruff check`, `ruff format --check`)"
          - "A GPU provider account (Modal or RunPod) with evidence of one launched instance"
          - "Langfuse running locally (docker compose) with at least one trace visible in the UI"
          - "Databricks free account created, because Volve takes about an hour to appear"
        reference: |
          ```python
          # smoke test: one traced call into a self-hosted Langfuse
          import os
          from langfuse import Langfuse

          lf = Langfuse(
              public_key=os.environ["LANGFUSE_PUBLIC_KEY"],
              secret_key=os.environ["LANGFUSE_SECRET_KEY"],
              host="http://localhost:3000",
          )
          trace = lf.trace(name="smoke", metadata={"stage": "p0"})
          trace.generation(
              name="hello",
              model="claude-opus-5",
              input=[{"role": "user", "content": "ping"}],
              output="pong",
              usage_details={"input": 1, "output": 1},
          )
          lf.flush()
          ```

          Repo side: `uv init`, `uv add ruff`, then in `pyproject.toml`

          ```toml
          [tool.ruff]
          line-length = 100
          [tool.ruff.lint]
          select = ["E", "F", "I", "UP", "B"]
          ```

          and `uv run ruff check .` in CI. Commit `uv.lock`.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: p0-learning-protocol
        module: p0-orient
        type: explain
        must_cover: false
        prompt: "State the working protocol the Anthropic coding-skills RCT implies for phases 1-4 of this track, and what its effect size actually was."
        rubric:
          - "Names the result: AI-assisted group ~50% vs hand-coding ~67% on concepts just used"
          - "Notes the effect size (Cohen's d ~0.74, p = 0.01) and that the time saving was not significant"
          - "Names debugging as the worst-hit skill"
          - "States the protocol: ask for explanations and reviews, type the code yourself, re-derive with the tab closed"
          - "States when to flip to delegation (phases 5-7, when shipping rather than learning)"
        reference: |
          Anthropic's January 2026 RCT (n=52, mostly junior engineers learning the Trio library)
          found the AI-assisted group scored about 50% on a quiz about concepts they had used
          minutes earlier, against about 67% for the hand-coding group — Cohen's d ≈ 0.74,
          p = 0.01, roughly two letter grades. The AI group finished about two minutes faster,
          which was not statistically significant. The steepest decline was in debugging:
          recognising that code is wrong and working out why. Crucially, learners who used AI
          strategically — asking for explanations and follow-ups while still writing code
          themselves — retained much more. The protocol for phases 1-4 is therefore: attempt
          first, ask for explanations rather than code, never paste the error, close the tab and
          re-derive, and self-test without the tool. Flip to full delegation only in phases 5-7,
          where the goal is shipping rather than skill formation.
        known_prior: false
        est_minutes: 15
        draft: true
