    checks:
      - id: b9-own-harness
        module: b9
        type: code
        must_cover: true
        prompt: "Build your own eval harness in roughly 200 lines: dataset, async runner with caching and cost accounting, scorers, versioned results, diff report."
        rubric:
          - "Dataset is JSONL with deterministic case ids; the runner is async and concurrency-limited with retries"
          - "Model calls are cached, keyed on (case id, prompt version, model), so reruns are cheap and comparable"
          - "Every run records model, prompt version, harness commit SHA, dataset version, and cost and latency per case"
          - "Scorers are plain callables returning a Score; raw traces are stored, not only the scores"
          - "A diff report against a baseline run with per-scorer aggregates and intervals"
        reference: |
          ```python
          from dataclasses import dataclass, asdict
          from typing import Callable
          import asyncio, hashlib, json, subprocess, time

          @dataclass
          class Score:
              name: str; value: float; passed: bool; detail: str = ""

          Scorer = Callable[[dict, dict], Score]     # (case, output) -> Score

          def run_meta():
              sha = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()
              return {"harness_sha": sha, "model": MODEL,
                      "prompt_version": PROMPT_VERSION, "dataset": DATASET_TAG,
                      "started": time.time()}

          def cache_key(case, prompt_version, model):
              return hashlib.sha256(
                  f"{case['id']}|{prompt_version}|{model}".encode()).hexdigest()

          async def run_case(case, sem, cache):
              async with sem:
                  k = cache_key(case, PROMPT_VERSION, MODEL)
                  if k in cache:
                      return cache[k]
                  t0 = time.perf_counter()
                  out = await system(case["input"])
                  out["latency_ms"] = (time.perf_counter() - t0) * 1000
                  out["cost_usd"] = price(out["usage"])
                  cache[k] = out
                  return out

          async def main(cases, scorers: list[Scorer]):
              sem, cache = asyncio.Semaphore(8), load_cache()
              outs = await asyncio.gather(*(run_case(c, sem, cache) for c in cases))
              rows = [{"case_id": c["id"], **asdict(s), **meta}
                      for c, o in zip(cases, outs) for s in (sc(c, o) for sc in scorers)]
              write_jsonl(f"results/{RUN_ID}.jsonl", rows)   # one row per case x scorer x run
          ```

          Then `diff.py --baseline <run> --candidate <run>` aggregates per scorer and per failure
          mode with bootstrap intervals. Store the raw traces next to the scores; the scores alone
          cannot be re-analysed.
        known_prior: false
        est_minutes: 45
        draft: true
      - id: b9-inspect-port
        module: b9
        type: code
        must_cover: true
        prompt: "Port the same eval suite to Inspect AI and run it."
        rubric:
          - "The dataset is expressed as Inspect Samples (input + target), reusing the same golden-set file"
          - "The system under test is a Solver; the scorers are Inspect Scorers producing the same verdicts"
          - "The run produces an Inspect log file and the results match the own-harness run on the same cases"
          - "Uses Inspect's own facilities (parallelism, limits, error handling) rather than reimplementing them"
          - "Log analysis shown: the eval log read back as a dataframe"
        reference: |
          ```python
          from inspect_ai import Task, task, eval
          from inspect_ai.dataset import json_dataset, FieldSpec
          from inspect_ai.solver import generate, system_message
          from inspect_ai.scorer import scorer, Score, Target, accuracy, model_graded_qa

          dataset = json_dataset(
              "golden-v1.2.0.jsonl",
              FieldSpec(input="question", target="answer_contains", id="id"),
          )

          @scorer(metrics=[accuracy()])
          def cited_page_supports():
              async def score(state, target: Target) -> Score:
                  ok = check_page_support(state.output.completion, target.text)
                  return Score(value="C" if ok else "I",
                               explanation=state.output.completion[:200])
              return score

          @task
          def report_qa():
              return Task(dataset=dataset,
                          solver=[system_message(SYSTEM), generate()],
                          scorer=[cited_page_supports(), model_graded_qa()])
          ```

          ```bash
          inspect eval report_qa.py --model anthropic/claude-opus-5 --limit 200
          inspect view                       # log browser
          ```

          Then read the log back (`inspect_ai.log.read_eval_log` into a dataframe) and check the
          per-case verdicts match your own harness on the same cases; a mismatch is a scorer bug in
          one of the two, and finding it is half the value of the port.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: b9-platform-instrumented
        module: b9
        type: code
        must_cover: true
        prompt: "Run the same suite through a platform (Langfuse or Phoenix) with tracing and a human-review queue."
        rubric:
          - "Traces exported via OTel or the platform SDK, with the same case ids as the golden set"
          - "The golden set uploaded as a platform dataset and the run recorded as an experiment against it"
          - "A human-review queue configured so sampled traces can be labelled and promoted back into the golden set"
          - "Scores from the same scorers appear on the platform, not a different set of platform-native metrics"
          - "Data export in a standard format demonstrated, so the golden set is not locked in"
        reference: |
          ```python
          from langfuse import Langfuse
          lf = Langfuse()

          # 1. the golden set becomes a platform dataset, ids preserved
          for case in golden:
              lf.create_dataset_item(dataset_name="golden-v1.2.0",
                                     id=case["id"], input=case["input"],
                                     expected_output=case["target"])

          # 2. the run becomes an experiment, traced, with OUR scorers attached
          for item in lf.get_dataset("golden-v1.2.0").items:
              with item.observe(run_name=RUN_ID) as trace_id:
                  out = system(item.input)
                  for s in (page_support(item, out), schema_valid(item, out)):
                      lf.score(trace_id=trace_id, name=s.name, value=float(s.passed))

          # 3. export, to prove the data is not locked in
          lf.api.datasets.get_items("golden-v1.2.0")   # -> write to JSONL in the repo
          ```

          The review queue is the part that earns the subscription: sample 10% of production
          traces, route them to a queue, label them in the UI, and promote the labelled ones back
          into the golden set with provenance recorded. Insist on export in a standard format — the
          golden set is the asset and it must never live only inside a vendor.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: b9-what-each-earned
        module: b9
        type: explain
        must_cover: true
        prompt: "Write the paragraph on what each of the three layers earned its keep for."
        rubric:
          - "Own harness credited with understanding: you know what every number means and can change any of it"
          - "Inspect AI credited with what it actually provides: sandboxing, parallelism and limits, log analysis, and CV signal"
          - "The platform credited with tracing, storage, diffing UI and the human-review queue"
          - "Names what each layer did NOT earn, so the paragraph is a judgement not a sales pitch"
          - "Ends with a stated own-vs-buy position"
        reference: |
          The hand-rolled harness earned understanding: 200 lines took a weekend and afterwards
          every number in every report is one I can trace to a line of code, which is why the
          caching key, the clustering unit and the diff logic are all correct rather than
          inherited. It earned nothing operationally — no UI, no sandbox, no log browser. Inspect
          AI earned the things that are genuinely tedious to build: sandboxed execution, sane
          parallelism and limits, error handling, and a first-class log format I can read back as a
          dataframe; it also happens to be the strongest CV signal in the field. It did not earn
          the judge design, which is still mine. The platform earned tracing, durable storage, the
          experiment-diff UI, and above all the human-review queue that turns production traces
          into labelled data. My position: own the golden set, the judge prompts and their
          calibration, the taxonomy and the scoring logic; buy tracing, storage and diffing; and
          treat standard-format export as a hard requirement.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: b9-own-vs-buy
        module: b9
        type: judge
        must_cover: false
        prompt: "Apply Hamel's four tool-selection criteria to your own stack and defend the resulting build-vs-buy split."
        rubric:
          - "Criterion 1: friction between seeing a failure and fixing it, assessed concretely on your workflow"
          - "Criterion 2: human-in-the-loop support - the tool empowers the annotator rather than automating them away"
          - "Criterion 3: transparency over magic; suspicion of a tool that writes the rubric and scores against it"
          - "Criterion 4: ecosystem fit and mandatory data export in a standard format"
          - "A concrete split stated, with one thing you would buy that you currently build, or vice versa"
        reference: |
          **Friction.** The path from "a trace looks wrong" to "a test exists for it" is the metric.
          In my stack that is: open the trace in Langfuse, click into the review queue, label it,
          promote it to the dataset, and it is in CI on the next run. Anything slower than a few
          minutes silently stops happening.

          **Human in the loop.** The best tools empower the annotator rather than automating them
          away. The platform's review queue passes; its auto-labelling feature is off.

          **Transparency.** Be suspicious of any tool that both writes the rubric and scores
          against it — there is no independent signal in that loop. My judges are versioned text
          files in the repo, not prompts inside a vendor UI.

          **Ecosystem and export.** OTel exporters only, and a scripted export of the dataset and
          scores into the repo on every run.

          **Split.** Build: golden set, judge prompts, calibration, taxonomy, scorers. Buy:
          tracing, storage, diff UI, review queue. The one I would flip: I currently build the
          annotation UI; if the platform's review queue supports my edge-case fields, I should buy
          it and spend the time on labels instead.
        known_prior: false
        est_minutes: 25
        draft: true
