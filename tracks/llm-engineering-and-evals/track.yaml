    checks:
      - id: a3-decision-memo
        module: a3
        type: explain
        must_cover: true
        prompt: "Take a real task and write the one-paragraph decision memo choosing prompt vs RAG vs fine-tune, with cost and latency numbers."
        rubric:
          - "The task and its acceptance criterion are stated first, in one sentence"
          - "All three options are costed: $/1k requests and p95 latency, plus one-off build cost"
          - "The ladder is applied cheapest-first, and the memo says what would have to be true to move up a rung"
          - "Names what fine-tuning cannot fix: missing knowledge that changes, which is RAG's job"
          - "Ends with a decision and a measurable trigger for revisiting it"
        reference: |
          **Task.** Classify each of 1,759 Volve daily drilling reports into an NPT cause taxonomy,
          at >= 0.85 macro-F1 on a held-out set built first.

          **Prompting a frontier model.** ~$0.004/report with a cached taxonomy prompt, about
          $7 for the whole corpus, p95 ~2.5 s, zero build cost. Measured macro-F1 0.79.

          **RAG.** Adds nothing here — the task needs no external facts, only the taxonomy, which
          fits in the prompt. Rejected on that ground, not on cost.

          **QLoRA on a 7-8B model.** ~$25 of GPU for the run, ~6 hours of my time, then ~$0.0003
          per report self-hosted, p95 ~350 ms. Needs ~800 labelled examples, which the golden set
          already covers.

          **Decision.** Prompt now (it ships today and is 0.06 short), and fine-tune only if
          throughput rises above ~50k reports/month, where the $7 becomes $200 and the latency
          matters. Revisit trigger: monthly volume, or macro-F1 below 0.75 on the rolling eval.
          Note what fine-tuning would not fix — a new operator's report format needs data, not a
          better classifier.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a3-qlora-run
        module: a3
        type: code
        must_cover: true
        prompt: "QLoRA a 7-8B model on your own curated dataset on one GPU."
        rubric:
          - "4-bit base with LoRA adapters; rank, alpha, target modules and dropout all stated"
          - "The dataset is your own and curated, with size and provenance stated"
          - "Training config recorded: epochs, effective batch size, LR and schedule, max seq len, seed"
          - "The run completes on one GPU with peak memory reported"
          - "Loss curve shown, and overfitting checked against a validation split"
        reference: |
          ```python
          from unsloth import FastLanguageModel
          from trl import SFTTrainer, SFTConfig

          model, tok = FastLanguageModel.from_pretrained(
              "unsloth/Qwen3-8B", max_seq_length=2048, load_in_4bit=True,
          )
          model = FastLanguageModel.get_peft_model(
              model, r=16, lora_alpha=16, lora_dropout=0.0,
              target_modules=["q_proj", "k_proj", "v_proj", "o_proj",
                              "gate_proj", "up_proj", "down_proj"],   # all-linear
              use_gradient_checkpointing="unsloth", random_state=20260922,
          )
          trainer = SFTTrainer(
              model=model, tokenizer=tok, train_dataset=train, eval_dataset=val,
              args=SFTConfig(
                  per_device_train_batch_size=4, gradient_accumulation_steps=8,  # eff. 32
                  num_train_epochs=2, learning_rate=2e-4, lr_scheduler_type="cosine",
                  warmup_ratio=0.03, bf16=True, eval_strategy="steps", eval_steps=50,
                  output_dir="out/npt-qlora-v1", seed=20260922,
              ),
          )
          trainer.train()
          ```

          2026 defaults worth starting from and then questioning: QLoRA before full fine-tuning,
          r=16 with alpha=16, all-linear target modules. Report peak VRAM and watch the validation
          loss — two epochs on 800 examples is already close to the overfitting boundary.
        known_prior: false
        est_minutes: 45
        draft: true
      - id: a3-serve-adapter
        module: a3
        type: code
        must_cover: true
        prompt: "Serve the trained adapter and show a request going through it."
        rubric:
          - "The adapter is served on top of the base model rather than merged, or the merge decision is justified"
          - "A serving stack is named and running (vLLM LoRA, or merged weights served directly)"
          - "A request and its response are shown end to end"
          - "Latency and memory reported, and compared with the base model"
          - "Multiple adapters or adapter switching considered, even if only one is used"
        reference: |
          ```bash
          # serve the base once, attach adapters at request time
          vllm serve Qwen/Qwen3-8B \
            --enable-lora \
            --lora-modules npt=out/npt-qlora-v1 \
            --max-lora-rank 16 --max-loras 4
          ```

          ```python
          import openai
          c = openai.OpenAI(base_url="http://localhost:8000/v1", api_key="x")
          r = c.completions.create(
              model="npt",                       # the adapter, not the base
              prompt=RENDER(report_text), max_tokens=16, temperature=0,
          )
          print(r.choices[0].text)               # -> "waiting_on_weather"
          ```

          Keeping the adapter unmerged is usually right: one base model in memory serves several
          task adapters, switching per request, and a retrained adapter ships without redeploying
          the base. Merge only when you are serving a single task at high volume and want to drop
          the small per-request LoRA overhead. Report both numbers — p95 with the adapter versus
          the base — because the overhead is small but not zero.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a3-before-after
        module: a3
        type: numeric
        must_cover: true
        prompt: "Show a before/after metric on a held-out set you built first, including the classic-ML control arm."
        rubric:
          - "The held-out set existed and was labelled before training began, and that order is evidenced"
          - "Baseline (prompted frontier model), fine-tune, and at least one classic-ML control (TF-IDF + GBM or a fine-tuned encoder) on the same set"
          - "Metric appropriate to the task, with an interval, and a paired test between arms"
          - "Cost and latency reported alongside quality for each arm"
          - "An honest conclusion, including the case where the encoder wins"
        reference: |
          Same held-out set (n = 220, labelled 2026-12-02, before any training run), macro-F1:

          | arm | macro-F1 | 95% CI | $/1k | p95 ms |
          |---|---|---|---|---|
          | TF-IDF + gradient boosting | 0.81 | [0.76, 0.86] | ~0 | 3 |
          | fine-tuned encoder (DeBERTa-v3-base) | 0.87 | [0.83, 0.91] | ~0.02 | 25 |
          | prompted frontier model (0-shot) | 0.79 | [0.74, 0.84] | 4.00 | 2,500 |
          | QLoRA 8B (ours) | 0.86 | [0.81, 0.90] | 0.30 | 350 |

          McNemar, encoder vs QLoRA: b=12, c=10, p=0.83 — no detectable difference.

          The honest conclusion is the one to write down: on this closed-set classification task
          the fine-tuned encoder matches the 8B LoRA at a tenth the cost and a tenth the latency,
          so the encoder ships. The LLM's advantage is elsewhere — free-form root-cause text and
          zero-shot coverage of a new operator's report format, neither of which this metric
          measures. Equinor's own public position is that they primarily use traditional ML on
          operational data; this result is that position, reproduced.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a3-lora-rank
        module: a3
        type: explain
        must_cover: true
        prompt: "Explain what LoRA rank actually controls and what happens at r=4 versus r=128 for your task."
        rubric:
          - "Rank is the inner dimension of the low-rank update BA; it bounds the update's expressible subspace"
          - "Parameter count scales linearly in r, so r=128 is 32x the trainable parameters of r=4"
          - "Low r underfits behaviour that needs broad change; high r overfits small datasets and costs memory"
          - "alpha/r is the effective scaling, so changing r without alpha changes the update magnitude"
          - "States what was actually observed on the learner's own task, not just theory"
        reference: |
          LoRA freezes W and learns `ΔW = BA` with `A: r×k`, `B: d×r`, so rank r is the dimension
          of the subspace in which the weights are allowed to move. Trainable parameters scale
          linearly in r — `r(d + k)` per targeted matrix — so r=128 trains 32x as many parameters
          as r=4. Low rank is a strong regulariser: it is enough for format, style and narrow
          classification, and it underfits when the task needs broad behavioural change. High rank
          buys capacity you usually do not have data for; on 800 examples r=128 overfits within an
          epoch and costs memory and adapter size for nothing. The subtlety is that the update is
          scaled by `alpha/r`, so raising r while holding alpha fixed *shrinks* each direction's
          contribution — the 2026 default of r = alpha = 16 keeps that scaling at 1. On the NPT
          task, r=4 lost about 3 F1 points, r=16 and r=64 were indistinguishable, and r=128 was
          worse on validation from step 200.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a3-dataset-poisoning
        module: a3
        type: explain
        must_cover: true
        prompt: "Name three ways a fine-tuning dataset silently poisons a model and how you would detect each."
        rubric:
          - "Format leakage: an artefact of the data pipeline is learned as part of the task; detected by evaluating on differently formatted inputs"
          - "Refusal collapse: a dataset with no refusals teaches the model never to refuse; detected by a held-out set of should-refuse prompts"
          - "Distribution narrowing: the model loses capability outside the fine-tuning distribution; detected by a retained general eval before and after"
          - "Each detection is a concrete eval you would run, not an inspection"
          - "Notes that all three are silent on the in-distribution held-out set, which is why the general eval is required"
        reference: |
          **Format leakage.** Every training example came out of the same pipeline, so a stray
          artefact — a trailing newline, a "Report:" prefix, consistent whitespace — becomes part
          of the learned task, and accuracy collapses on production inputs that lack it. Detect by
          building a held-out slice with deliberately perturbed formatting and comparing.

          **Refusal collapse.** A dataset of 800 answered questions contains zero refusals, so the
          model learns that the correct action is always to answer. On an unanswerable question it
          confabulates. Detect with a should-refuse slice and an abstention-rate metric, measured
          before and after.

          **Distribution narrowing.** Fine-tuning on NPT classification degrades everything else —
          the model gets worse at the free-form summarisation it used to handle. Detect by keeping
          a small general capability eval and running it on the base and the tuned model.

          All three are invisible on an in-distribution held-out set, which is exactly why that set
          is not sufficient evidence that a fine-tune worked.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a3-lora-params
        module: a3
        type: numeric
        must_cover: false
        prompt: "Compute the number of trainable parameters and the adapter size for a given LoRA configuration, and compare with full fine-tuning."
        rubric:
          - "Per-matrix formula r*(d_in + d_out) applied to each targeted module, with the module shapes stated"
          - "Summed over layers and over the target module list"
          - "Expressed as a percentage of the base model's parameters"
          - "Adapter file size computed from the parameter count and the dtype"
          - "Optimizer-state memory contrasted with full fine-tuning to explain why QLoRA fits on one GPU"
        reference: |
          8B model: `n_layer = 36`, `d_model = 4096`, `d_ffn = 12288`, `r = 16`, all-linear.

          ```
          per layer:
            q,k,v,o : 4 × 16 × (4096 + 4096)      =   524,288
            gate,up : 2 × 16 × (4096 + 12288)     =   524,288
            down    : 1 × 16 × (12288 + 4096)     =   262,144
            subtotal                               = 1,310,720
          all layers: 36 × 1,310,720               = 47,185,920  (~47.2M)
          share of an 8B base: 47.2e6 / 8e9        = 0.59%
          adapter size (bf16): 47.2e6 × 2 bytes    = 94 MB
          ```

          Memory is the real point. Full fine-tuning in bf16 with AdamW needs weights (16 GB) plus
          gradients (16 GB) plus two optimizer moments (32 GB in fp32) ≈ 64 GB before activations.
          QLoRA holds the base in 4-bit (~4.5 GB) and keeps optimizer state only for 47M
          parameters (~0.6 GB), which is why an 80 GB card is comfortable and a 24 GB card is
          feasible.
        known_prior: false
        est_minutes: 25
        draft: true
