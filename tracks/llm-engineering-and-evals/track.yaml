    checks:
      - id: a1-mha-from-memory
        module: a1
        type: code
        must_cover: true
        prompt: "Write multi-head causal self-attention from memory on a blank page, with a correct mask and correct shapes."
        rubric:
          - "Scaled dot-product with 1/sqrt(d_head), not 1/sqrt(d_model)"
          - "Causal mask applied before softmax with -inf, not after with zeros"
          - "Heads split and merged with the correct reshape/transpose order (B, T, nh, hd) -> (B, nh, T, hd)"
          - "Output projection applied after merging heads"
          - "Shapes stated at every line and the mask broadcast correctly over batch and head dims"
        reference: |
          ```python
          import math, torch, torch.nn as nn, torch.nn.functional as F

          class CausalSelfAttention(nn.Module):
              def __init__(self, d_model: int, n_head: int):
                  super().__init__()
                  assert d_model % n_head == 0
                  self.n_head, self.d_head = n_head, d_model // n_head
                  self.qkv = nn.Linear(d_model, 3 * d_model, bias=False)
                  self.proj = nn.Linear(d_model, d_model, bias=False)

              def forward(self, x):                      # x: (B, T, C)
                  B, T, C = x.shape
                  q, k, v = self.qkv(x).split(C, dim=2)  # each (B, T, C)
                  # (B, T, C) -> (B, nh, T, hd)
                  q = q.view(B, T, self.n_head, self.d_head).transpose(1, 2)
                  k = k.view(B, T, self.n_head, self.d_head).transpose(1, 2)
                  v = v.view(B, T, self.n_head, self.d_head).transpose(1, 2)

                  att = (q @ k.transpose(-2, -1)) / math.sqrt(self.d_head)   # (B, nh, T, T)
                  causal = torch.ones(T, T, dtype=torch.bool, device=x.device).tril()
                  att = att.masked_fill(~causal, float("-inf"))              # BEFORE softmax
                  att = F.softmax(att, dim=-1)
                  y = att @ v                                               # (B, nh, T, hd)
                  y = y.transpose(1, 2).contiguous().view(B, T, C)          # merge heads
                  return self.proj(y)
          ```

          The two classic errors: dividing by `sqrt(d_model)` instead of `sqrt(d_head)`, and
          zeroing the masked entries after softmax (which leaves the rows unnormalised) instead of
          setting them to `-inf` before it.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a1-bpe-implement
        module: a1
        type: code
        must_cover: true
        prompt: "Implement BPE training and encoding: learn a merge table from a corpus and encode a new string with it."
        rubric:
          - "Training counts adjacent pair frequencies and greedily merges the most frequent pair, repeating to the target vocab size"
          - "Merges are stored in learned order; encoding replays them in that order, not by frequency"
          - "Works on bytes (or byte-level tokens) so any input is representable, with no UNK"
          - "Encoding a string the tokenizer has never seen produces valid tokens"
          - "Round-trip decode(encode(s)) == s is demonstrated"
        reference: |
          ```python
          from collections import Counter

          def get_stats(ids):
              return Counter(zip(ids, ids[1:]))

          def merge(ids, pair, new_id):
              out, i = [], 0
              while i < len(ids):
                  if i < len(ids) - 1 and (ids[i], ids[i + 1]) == pair:
                      out.append(new_id); i += 2
                  else:
                      out.append(ids[i]); i += 1
              return out

          def train_bpe(text: str, vocab_size: int):
              ids = list(text.encode("utf-8"))          # byte level: no UNK possible
              merges = {}                                # pair -> new id, IN LEARNED ORDER
              for new_id in range(256, vocab_size):
                  stats = get_stats(ids)
                  if not stats:
                      break
                  pair = max(stats, key=stats.get)
                  ids = merge(ids, pair, new_id)
                  merges[pair] = new_id
              return merges

          def encode(text: str, merges: dict):
              ids = list(text.encode("utf-8"))
              for pair, new_id in merges.items():        # replay in learned order
                  ids = merge(ids, pair, new_id)
              return ids
          ```

          Decoding is the inverse merge table applied to bytes, then `bytes(...).decode("utf-8",
          errors="replace")`.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: a1-tokenization-failures
        module: a1
        type: explain
        must_cover: true
        prompt: "Name three model failures that trace back to tokenization and explain the mechanism in each case."
        rubric:
          - "Arithmetic and digit handling: numbers split into inconsistent multi-digit chunks, so column alignment is not visible to the model"
          - "Character-level tasks (spelling, reversing, counting letters): the model never sees characters, only token ids"
          - "Non-English and code cost/quality: more tokens per unit of meaning, so less effective context and worse compression"
          - "Names at least one concrete artefact: trailing-whitespace tokens, SolidGoldMagikarp-style glitch tokens, or leading-space variants"
          - "States that these are properties of the tokenizer, not of the transformer"
        reference: |
          First, arithmetic. BPE chops numbers into inconsistent chunks ("1234" may be one token,
          "12345" three), so digits are not aligned in columns the way the algorithm needs; models
          get long-multiplication wrong in ways that track the merge table rather than the maths.
          Second, character-level tasks. The model never observes characters — only ids — so
          counting the r's in "strawberry", reversing a string, or spelling is inference about
          token internals rather than reading. Third, non-English and whitespace-sensitive text.
          A tokenizer trained mostly on English spends far more tokens per unit of meaning in other
          languages, which shrinks effective context, raises cost, and degrades quality; trailing
          whitespace and leading-space token variants split a word into a distribution the model
          rarely saw, and under-trained tokens (SolidGoldMagikarp) produce outright glitchy
          behaviour. All three are tokenizer artefacts, not transformer limitations.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a1-rope-vs-learned
        module: a1
        type: explain
        must_cover: true
        prompt: "State the difference between absolute/learned positional embeddings and RoPE."
        rubric:
          - "Learned/absolute: a position vector added to the token embedding at the input, one per index, learned"
          - "RoPE: a rotation applied to q and k inside each attention layer, not added to the residual stream"
          - "RoPE encodes relative position: the q-k dot product depends on (m - n), not on m and n separately"
          - "Learned embeddings are undefined beyond max_seq_len; RoPE is defined for any index"
          - "Notes that RoPE touches every layer's attention rather than the input once"
        reference: |
          Absolute or learned positional embeddings are a lookup table of one vector per position,
          added to the token embedding once at the input. They are parameters, so positions beyond
          the trained `max_seq_len` simply do not exist, and position information has to survive the
          whole residual stream. RoPE instead applies a position-dependent rotation to the query and
          key vectors inside every attention layer, pairing adjacent dimensions and rotating each
          pair by an angle proportional to the position index and inversely proportional to a
          per-pair wavelength. Nothing is added to the residual stream. The consequence is that the
          resulting q-k inner product is a function of the offset (m - n) only, so RoPE is a
          relative scheme expressed in absolute terms — which is why it composes with caching, works
          at any index, and is what every 2026 open model ships.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a1-rope-extrapolation
        module: a1
        type: derive
        must_cover: true
        prompt: "Derive why the RoPE q-k product depends only on the relative offset, then explain what position interpolation and NTK-aware scaling change and why extrapolation still degrades."
        rubric:
          - "Writes the 2D rotation form and shows q_m . k_n = Re(q z_m * conj(k z_n)) collapses to a function of (m - n)"
          - "States the frequency schedule theta_i = base^(-2i/d) and that low-i pairs rotate fast, high-i pairs slowly"
          - "Position interpolation: rescale m by L_train/L_target, compressing positions into the trained range, uniformly across frequencies"
          - "NTK-aware / YaRN: change the base (or scale frequencies non-uniformly) so high-frequency pairs are left alone and low-frequency pairs are interpolated"
          - "Explains the failure: at unseen offsets the slow pairs enter phase regions never observed in training, so attention scores drift"
        reference: |
          Take a dimension pair and write it as a complex number. RoPE sets
          `q̃_m = q · e^{i m θ}` and `k̃_n = k · e^{i n θ}`. The attention contribution is

          ```
          Re( q̃_m · conj(k̃_n) ) = Re( q · conj(k) · e^{i(m-n)θ} )
          ```

          — a function of the offset `m - n` only. Summing over pairs with
          `θ_i = base^(-2i/d)` (base typically 10000) gives fast-rotating low-index pairs (local
          detail) and slow-rotating high-index pairs (long-range position).

          **Position interpolation** rescales the index, `m -> m · L_train/L_target`, squeezing all
          positions back inside the trained phase range — uniformly, which blurs the fast pairs that
          carried local structure. **NTK-aware scaling / YaRN** instead raise the base (or scale
          per-frequency), leaving high-frequency pairs untouched and interpolating only the slow
          ones, which is why they need far less fine-tuning.

          Extrapolation still degrades because for large `m - n` the slow pairs reach phase angles
          the model never saw in training; the attention logits are then evaluated off-distribution
          and the model's relative-distance calibration drifts.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a1-chinchilla-budget
        module: a1
        type: numeric
        must_cover: true
        prompt: "Given a $50k compute budget and a target eval, argue for a parameter count and a token count, citing Chinchilla and its known caveats."
        rubric:
          - "Converts dollars to FLOPs via a stated GPU price and MFU, showing the arithmetic"
          - "Applies C = 6ND and the Chinchilla ratio of roughly 20 tokens per parameter to get a compute-optimal point"
          - "States the caveat: Chinchilla ignores inference, so a served model should be smaller and over-trained (Sardana & Frankle)"
          - "Gives a concrete final recommendation with both N and D, not a formula"
          - "Names at least one further caveat: data availability/quality, eval target, or the cost of the runs needed to fit the curve"
        reference: |
          **Budget to FLOPs.** $50,000 at $2/H100-hour = 25,000 H100-hours. An H100 at ~4e14
          dense bf16 FLOP/s and 40% MFU gives ~1.6e14 effective FLOP/s, so

          ```
          C = 25,000 h × 3600 s/h × 1.6e14 FLOP/s ≈ 1.4e22 FLOPs
          ```

          **Chinchilla-optimal.** With `C = 6ND` and `D ≈ 20N`:

          ```
          120 N² = 1.4e22  ->  N² = 1.17e20  ->  N ≈ 1.08e10   (10.8B params)
          D = 20N ≈ 2.16e11 tokens                             (216B tokens)
          check: 6 × 1.08e10 × 2.16e11 ≈ 1.4e22 FLOPs          (consistent)
          ```

          **The recommendation, and why it is not the Chinchilla point.** Chinchilla minimises
          training loss for a fixed training budget and ignores inference entirely. Sardana &
          Frankle show that once you amortise serving, the optimum moves to a *smaller, more
          heavily over-trained* model. For a served product I would take **N ≈ 3B, D ≈ 780B
          tokens** (~260 tokens/param, the same 1.4e22 FLOPs), accepting a slightly worse training
          loss for roughly 3.5x cheaper inference and a model that fits one GPU.

          Further caveats: 780B clean in-domain tokens may not exist, which caps D; and the
          scaling-law fit itself costs several small runs out of the same budget.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a1-gpt2-trained
        module: a1
        type: code
        must_cover: true
        prompt: "Point at your own repo containing a GPT-2-class model you trained end to end, and name the run's configuration from memory."
        rubric:
          - "A public repo with the training script, config, and the produced checkpoint or its download"
          - "States parameter count, tokens seen, batch size in tokens, peak LR and schedule, and wall-clock/GPU cost"
          - "Tokenizer is your own or the run's own, and its vocab size is stated"
          - "A sample generation is shown and is coherent English"
          - "The run is reproducible: one command, pinned deps, a recorded commit SHA"
        reference: |
          ```bash
          # nanochat speedrun: tokenizer -> pretrain -> midtrain -> SFT -> eval, one script
          git clone https://github.com/karpathy/nanochat && cd nanochat
          bash speedrun.sh            # ~$48 on an 8xH100 node, ~2h wall clock
          ```

          Record in the README, from the run's own logs, not from memory of the defaults:

          | field | value |
          |---|---|
          | parameters | e.g. 561M |
          | tokens seen | e.g. 11.2B |
          | tokens per step | e.g. 524,288 (grad-accum × micro-bsz × seq_len × world) |
          | optimizer | AdamW, β=(0.9, 0.95), wd 0.1, grad clip 1.0 |
          | LR schedule | warmup 700 steps, cosine to 10% of peak |
          | cost | GPU-hours × $/hour, stated |
          | commit | the exact SHA the checkpoint came from |

          The artefact is the config plus the loss curve plus one sample, not the checkpoint alone.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a1-loss-curve
        module: a1
        type: explain
        must_cover: true
        prompt: "Explain the shape of your own training loss curve: the initial drop, the plateau, the effect of the LR schedule, and what a divergence or a val/train gap would have looked like."
        rubric:
          - "Initial near-vertical drop explained as learning the unigram/bigram distribution; names the expected starting loss ~ln(vocab_size)"
          - "The long power-law-ish plateau explained as the regime where scaling laws apply"
          - "Warmup and cosine decay visible in the curve, with the late-decay drop attributed to the LR, not to new learning"
          - "Names one pathology and its signature: loss spike/divergence (bad init, LR too high, bad data batch), or a widening val-train gap (overfitting a small corpus)"
          - "Uses the learner's own numbers, not generic ones"
        reference: |
          A correct curve starts near `ln(vocab_size)` — about 10.8 for a 50k vocab — because an
          untrained model is uniform over tokens. The first few hundred steps drop almost
          vertically as the model learns the unigram and then bigram distribution; that region
          carries almost no information about your architecture. Then the curve enters a long,
          slowly decreasing regime, roughly a power law in tokens seen; this is the part scaling
          laws describe and the part worth comparing between runs. Warmup shows as a brief
          shallow start, and cosine decay shows as a visible extra drop in the last 10-20% of
          training that is the learning rate falling, not the model discovering anything. Two
          pathologies to name: a sharp spike that does not recover means the LR is too high, the
          init is mis-scaled, or a bad batch hit fp16/bf16 range; and a validation curve peeling
          away from training means the corpus is being memorised.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a1-training-dynamics
        module: a1
        type: explain
        must_cover: false
        prompt: "Explain what an activation-histogram or gradient-histogram diagnostic tells you about init scaling, saturated units and dead neurons, and what you would change in response."
        rubric:
          - "Says what a healthy activation histogram looks like: roughly unit-scale, not collapsing to zero or saturating at the tanh/ReLU extremes"
          - "Identifies saturated tanh units (mass at ±1) and dead ReLU units (permanently zero) from the histogram"
          - "Links the pathology to init scale, and names the fix: scale the last layer's init down, use a residual-depth-aware init, or normalise"
          - "Explains the gradient-to-data ratio as the quantity that says whether the LR is sensible"
          - "Notes that normalisation layers make the network robust to init but do not remove the diagnostic's value"
        reference: |
          Karpathy's makemore-3 diagnostic is to plot, per layer, the distribution of activations
          and of gradients. A healthy network shows activations of roughly unit scale with a stable
          spread across depth. Two pathologies are visible immediately: tanh units piling up at ±1
          (saturated — their local gradient is ~0, so those units learn nothing), and ReLU units
          stuck at exactly zero for every example in the batch (dead — no gradient ever flows
          back). Both are usually an init-scale problem: the pre-activations are too large, which
          you fix by scaling the initial weights down, especially on the final projection of each
          residual block, or by inserting a normalisation layer. The gradient plot gives the
          complementary number: the ratio of (learning-rate × gradient) to the parameter's own
          scale, which should sit around 1e-3. Normalisation makes the network tolerate a bad init;
          it does not tell you that you had one.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a1-attention-flops
        module: a1
        type: numeric
        must_cover: false
        prompt: "For a decoder-only model with d_model, n_layer and sequence length T, compute the FLOPs per token split between the MLP/projection terms and the attention term, and state the T at which attention stops being negligible."
        rubric:
          - "Uses ~6N FLOPs per token for the parameter-linear terms (fwd+bwd)"
          - "Uses ~12 * n_layer * d_model * T additional FLOPs per token for the quadratic attention term"
          - "Sets the two equal and solves for T to find the crossover"
          - "Plugs in real numbers and states the crossover for a named config"
          - "States the practical consequence: at typical T the quadratic term is a minority of training FLOPs, which is why C = 6ND is a usable approximation"
        reference: |
          Per token, the parameter-linear work (forward + backward) is `≈ 6N` FLOPs. The extra,
          sequence-dependent attention work (the QKᵀ and AV matmuls) is
          `≈ 12 · n_layer · d_model · T` FLOPs per token.

          For a GPT-2-medium-ish config, `n_layer = 24`, `d_model = 1024`, `N ≈ 350e6`:

          ```
          linear      : 6 × 3.5e8              = 2.1e9  FLOPs/token
          attention   : 12 × 24 × 1024 × T     = 2.95e5 × T
          crossover T : 2.1e9 / 2.95e5         ≈ 7,100 tokens
          ```

          So at T = 1024 the attention term is `3.0e8 / 2.1e9 ≈ 14%` of the work, and `C = 6ND`
          is a ~15%-accurate approximation. At T = 32k it is over 4x the linear term and the
          approximation is useless — which is the quantitative reason long-context training needs
          FlashAttention-class kernels and why `6ND` is quoted with a context-length caveat.
        known_prior: false
        est_minutes: 25
        draft: true
