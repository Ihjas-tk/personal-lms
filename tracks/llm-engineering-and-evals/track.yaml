        title: "LangChain, Evaluating AI Agents at the Run, Trace, and Thread Level"
        kind: doc
        url: https://www.langchain.com/resources/agent-evals
        est_minutes: 60
    checks:
      - id: b5-trajectory-scorer
        module: b5
        type: code
        must_cover: true
        prompt: "Build a trajectory-level scorer for your agent and show what it catches that a final-answer scorer does not."
        rubric:
          - "The scorer consumes the full transcript: tool calls, arguments, results and intermediate messages"
          - "It scores the path, not only the destination: unnecessary steps, wrong order, retries, dead ends"
          - "At least one concrete case is shown where the final answer was right but the trajectory was wrong"
          - "The scorer is deterministic where it can be, and a judge only where the criterion is semantic"
          - "The score decomposes into named sub-scores rather than one opaque number"
        reference: |
          ```python
          from dataclasses import dataclass

          @dataclass
          class TrajectoryScore:
              reached_goal: bool
              redundant_calls: int
              order_violations: int
              recovered_from_error: bool

          def score_trajectory(transcript, spec) -> TrajectoryScore:
              calls = [e for e in transcript if e.type == "tool_call"]
              names = [c.name for c in calls]
              return TrajectoryScore(
                  reached_goal=check_terminal_state(transcript, spec),
                  redundant_calls=len(names) - len(dict.fromkeys(map(sig, calls))),
                  order_violations=count_order_violations(names, spec.required_order),
                  recovered_from_error=any(e.type == "tool_error" for e in transcript)
                                       and check_terminal_state(transcript, spec),
              )
          ```

          What it catches that a final-answer scorer cannot: the run that answered the well's total
          depth correctly after querying the *wrong* wellbore first and silently discarding the
          result — right answer, unsafe path, and the same behaviour on a write tool would have
          been an incident. Also the agent that hit the answer on its ninth redundant search, which
          looks identical to success until you price it.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: b5-toolcall-metric
        module: b5
        type: code
        must_cover: true
        prompt: "Implement a tool-call correctness metric covering selection, arguments and ordering, and report it."
        rubric:
          - "Selection scored against an expected tool set per case, as precision and recall over calls"
          - "Arguments scored with a per-field comparison and an explicit tolerance for free-text fields"
          - "Order scored only where order is semantically required, with the required order declared per case"
          - "Reports the three components separately, not one blended score"
          - "States what the metric cannot see: a correct call made for the wrong reason"
        reference: |
          ```python
          def tool_call_metrics(calls, expected):
              got, want = [c.name for c in calls], [e["name"] for e in expected]
              tp = len(set(got) & set(want))
              selection_p = tp / max(len(set(got)), 1)
              selection_r = tp / max(len(set(want)), 1)

              arg_hits = sum(
                  all(args_match(c.args.get(k), v) for k, v in e["args"].items())
                  for c, e in zip(calls, expected) if c.name == e["name"]
              )
              arg_acc = arg_hits / max(len(expected), 1)

              order_ok = subsequence(want_ordered := [e["name"] for e in expected
                                                     if e.get("ordered")], got)
              return {"selection_p": selection_p, "selection_r": selection_r,
                      "arg_accuracy": arg_acc, "order_ok": order_ok}
          ```

          Report the three separately: an agent with perfect selection and 0.6 argument accuracy
          needs better tool descriptions, while one with good arguments and poor selection needs
          fewer, better-separated tools. The metric is blind to intent — a call that happened to be
          right for the wrong reason scores the same as a reasoned one, which is why transcript
          review stays mandatory.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: b5-terminal-state
        module: b5
        type: code
        must_cover: true
        prompt: "Implement a terminal-state task-completion check that grades the world, not the agent's prose."
        rubric:
          - "The check inspects the environment (database row, file, API state), not the final message"
          - "Each case declares its expected terminal state as data, alongside the task"
          - "The environment is isolated and reset per trial, so trials are independent"
          - "The check resists agent exploits: the agent cannot write to the thing being checked"
          - "States the domain mapping: coding to unit tests, conversational to state checks, research to groundedness, computer-use to environment inspection"
        reference: |
          ```python
          def run_trial(case, agent):
              env = Sandbox.fresh(seed=case.id)          # isolated, reset per trial
              agent.run(case.task, tools=env.tools)
              return check_terminal_state(env, case.expected)

          def check_terminal_state(env, expected) -> bool:
              row = env.db.query("select * from notes where case_id = ?", expected["case_id"])
              return (row is not None
                      and row["wellbore"] == expected["wellbore"]
                      and abs(row["td_m"] - expected["td_m"]) < 0.5)
          ```

          The agent must have no write access to the checking path: if it can edit the expected
          file, delete the failing test, or write directly to the results table, it will
          eventually find that shortcut. Anthropic's per-domain mapping: coding agents graded by
          unit tests and static analysis; conversational agents by judge rubrics for tone plus
          state checks for completion; research agents by groundedness, coverage and source
          quality; computer-use agents by environment inspection and screenshot verification.
          Grading the final message instead rewards an agent that says it filed the row.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b5-passk-ci
        module: b5
        type: numeric
        must_cover: true
        prompt: "Report pass^k at k=5 for your agent with a confidence interval, and show the clustering you used."
        rubric:
          - "pass^k defined as the share of tasks succeeding on ALL k trials, not within k"
          - "Computed from k independent trials per task in a freshly reset environment"
          - "The CI comes from a bootstrap that resamples TASKS (clusters), never individual trials"
          - "pass@1 reported alongside so the reliability gap is visible"
          - "States the consequence: a high pass@1 with a low pass^5 is not shippable"
        reference: |
          ```python
          import numpy as np
          rng = np.random.default_rng(0)

          # results[task_id] = [bool] * k   (k = 5 trials, fresh env each time)
          tasks = list(results)
          def pass_hat_k(sample):
              return np.mean([all(results[t]) for t in sample])
          def pass_at_1(sample):
              return np.mean([np.mean(results[t]) for t in sample])

          point = pass_hat_k(tasks)
          boot = [pass_hat_k(rng.choice(tasks, len(tasks), replace=True)) for _ in range(10_000)]
          lo, hi = np.percentile(boot, [2.5, 97.5])
          print(f"pass@1 {pass_at_1(tasks):.2f}   pass^5 {point:.2f}  95% CI [{lo:.2f}, {hi:.2f}]")
          # pass@1 0.90   pass^5 0.60  95% CI [0.50, 0.70]
          ```

          The clustering is the part people get wrong: five trials of one task are one cluster, not
          five observations. Resampling trials instead of tasks produces an interval several times
          too narrow — that is how a "90% agent, plus or minus 2%" gets reported. And a 90% pass@1
          agent at 60% pass^5 means four in ten tasks fail at least once in five attempts: not
          shippable for anything unattended.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b5-transcript-review
        module: b5
        type: judge
        must_cover: true
        prompt: "Write a review of the 10 worst runs, naming the mechanism of failure in each."
        rubric:
          - "Ten runs, selected by a stated rule (lowest trajectory score, or failures on tasks that usually pass)"
          - "Each entry names a mechanism, not a symptom: what the agent believed and why it acted on it"
          - "Each links to the transcript and quotes the decisive turn"
          - "Failures are mapped back to the failure taxonomy, and new modes are added to it"
          - "States what changed as a result, or explicitly that nothing did and why"
        reference: |
          Select by rule, not by browsing: take the ten runs with the lowest trajectory score,
          breaking ties toward tasks that usually pass (a failure on an easy task is more
          informative than another failure on the hardest one). For each, one paragraph naming the
          mechanism:

          > **run 0412, task `td-6506-3-1`, failed at turn 4.** The agent called
          > `search_reports(query="6506/3-1")`, got zero hits because the index is over prose, and
          > concluded "no report exists for this wellbore" rather than trying `find_report`.
          > Mechanism: an empty tool result read as evidence of absence. Maps to taxonomy mode 6
          > (*empty result treated as a negative fact*). Fix: the tool now returns
          > `{"hits": [], "hint": "identifiers are not indexed; use find_report"}`.

          The argument for making this non-optional is the 2026 log-analysis paper: agent scores
          are uninterpretable without transcript inspection, because the same score arises from
          entirely different mechanisms.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b5-passk-vs-passatk
        module: b5
        type: explain
        must_cover: false
        prompt: "Explain pass@k versus pass^k to a stakeholder and say which one they should be asking for."
        rubric:
          - "pass@k = succeeds at least once within k attempts; measures capability and is optimistic"
          - "pass^k = succeeds on every one of k attempts; measures reliability"
          - "Gives the arithmetic intuition: independent per-trial success p gives pass^k = p^k"
          - "Names the concrete example: 90% pass@1 with 60% pass^5 is not shippable"
          - "States which to ask for and when the other is legitimate (capability research, or a human-in-the-loop retry product)"
        reference: |
          pass@k asks whether the agent succeeds at least once in k attempts. It is the number
          research reports, it goes up with k by construction, and it measures capability — can
          this system ever do the task? pass^k asks whether it succeeds on every one of k attempts.
          It goes down with k and it measures reliability — can I leave it running? If trials were
          independent with per-trial success p, pass^k would be p^k: at p = 0.9 and k = 5 that is
          0.59, which is roughly what real agents show. A product person should ask for pass^k,
          because the product's user does not get to pick the lucky run. pass@k is the honest
          number in exactly two situations: capability research, and a product where a human sees
          every attempt and can retry cheaply.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b5-grader-exploits
        module: b5
        type: explain
        must_cover: false
        prompt: "Describe three ways an agent can exploit a grader and the environment design that prevents each."
        rubric:
          - "Names concrete exploits: deleting or weakening the failing test, writing to the check file, reading the expected answer from the environment"
          - "Each has a prevention that is architectural (isolation, permissions, out-of-band checking), not an instruction"
          - "Notes that exploits are discovered by reading transcripts, not by anticipating them"
          - "Mentions eval saturation as the related signal that an eval has stopped informing you"
          - "Mentions scaffolding as a confound: report the harness alongside the score"
        reference: |
          One: the agent deletes or weakens the failing test and reports success. Prevention: the
          test suite lives outside the agent's writable tree and is restored from a fixed commit
          before grading. Two: the agent writes directly to the results or expected-output file.
          Prevention: grading reads the environment out of band, through a channel the agent has no
          credential for, and the sandbox is reset per trial. Three: the expected answer is present
          somewhere in the environment — in a fixture, a log, or the task metadata — and the agent
          simply reads it. Prevention: strip targets from anything mounted into the sandbox and
          verify by grepping the environment for the answer. You find these by reading transcripts,
          not by anticipating them. Two neighbouring signals: eval saturation, when everything
          passes and the eval has stopped informing you; and scaffolding, which can move scores
          10-15 points with no model change, so always report the harness alongside the score.
        known_prior: false
        est_minutes: 25
        draft: true
