    checks:
      - id: b1-taxonomy-from-100
        module: b1
        type: judge
        must_cover: true
        prompt: "Hand over a one-page failure taxonomy with counts, derived from at least 100 traces you personally read."
        rubric:
          - "At least 100 traces read by the learner, with the raw open codes preserved and shown"
          - "Axial coding produces 5-9 mutually comprehensible categories, each with a one-line definition and an example trace id"
          - "Counts and percentages given, summing to the number of failing traces"
          - "The sampling method is stated, including how the roughly 50:50 pass/fail split was obtained"
          - "Saturation is evidenced: new traces stopped producing new codes"
        reference: |
          The deliverable is one page with three artefacts. First, the raw open codes — free-form
          notes written while reading, before any schema existed — kept verbatim, because they are
          what you later mine for judge prompts. Second, the axial table:

          | # | failure mode | definition | n | % of failures | example |
          |---|---|---|---|---|---|
          | 1 | cites a page that does not support the claim | citation present but wrong page | 21 | 30% | t-0412 |
          | 2 | answers an unanswerable question | no supporting passage exists | 16 | 23% | t-0137 |
          | ... | | | | | |

          Third, the method note: how traces were sampled (stratified to ~50:50 pass/fail, spanning
          query types), how many were read, and the evidence of saturation — e.g. "traces 90-120
          produced no new codes". Five to nine categories is the target: fewer and the taxonomy is
          not actionable, more and it has not been axially coded.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b1-top3-60pct
        module: b1
        type: numeric
        must_cover: true
        prompt: "Show that the top three failure modes in your taxonomy account for at least 60% of failures, and say what you would do if they did not."
        rubric:
          - "The frequency table is shown with the cumulative share of the top three computed explicitly"
          - "The denominator is stated: share of failing traces, not of all traces"
          - "States the diagnosis if the distribution is flat: the categories are too fine, or the sample is not representative"
          - "States the action: re-do axial coding at a coarser grain, or sample more traces of the under-represented type"
          - "Notes that a very concentrated distribution (top one at 80%) is also a signal - probably one bug, not a taxonomy"
        reference: |
          Compute over failing traces only:

          ```
          failures n = 70
          mode 1  21   30.0%   cum 30.0%
          mode 2  16   22.9%   cum 52.9%
          mode 3  11   15.7%   cum 68.6%   <- top three = 68.6% >= 60%
          mode 4   9   12.9%
          mode 5   7   10.0%
          mode 6   6    8.6%
          ```

          If the top three do not reach 60%, the usual cause is that axial coding stopped too
          early and the categories are still open codes — merge semantically adjacent ones and
          recount. The second cause is a sample that over-represents one query type, in which case
          read more traces from the under-sampled segments rather than re-coding. The opposite
          signal matters too: if one mode is 80% of failures you probably have a single bug rather
          than a taxonomy, and you should fix it and re-run the analysis.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b1-mode-no-metric-finds
        module: b1
        type: explain
        must_cover: true
        prompt: "Name at least one failure mode in your taxonomy that no off-the-shelf metric would have surfaced, and explain why the standard metrics miss it."
        rubric:
          - "A specific, domain-grounded failure mode, not a generic 'hallucination'"
          - "Explains why a similarity metric misses it: the output is fluent and topically on-target"
          - "Explains why a generic RAG-triad judge misses it: the criterion is not in its rubric"
          - "States the concrete user-visible harm"
          - "Names the evaluator you would write for it instead"
        reference: |
          Example from the end-of-well-report system: *the answer cites a page that exists and is
          on-topic but does not contain the claimed fact*. ROUGE and embedding similarity miss it
          entirely because the answer is fluent and semantically close to the reference. A generic
          faithfulness judge misses it too, because it checks whether the answer is supported by
          the retrieved context as a whole, not whether the specific page number attached to the
          claim is the page the claim came from — page-level citation correctness is simply not in
          its rubric. The user-visible harm is the worst kind: a plausible answer with a checkable-
          looking citation that fails when an engineer opens the PDF, which destroys trust faster
          than an outright refusal. The evaluator is code-based, not a judge: resolve the cited
          page, re-run the claim against that page's text, and assert support.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b1-binary-vs-likert
        module: b1
        type: explain
        must_cover: false
        prompt: "Defend binary pass/fail with a written critique over a 1-5 Likert scale, and name the exceptions."
        rubric:
          - "Binary forces the annotator to decide what actually matters; a 3 carries no actionable information"
          - "The critique text is the asset: it is what you mine for judge prompts and for the taxonomy"
          - "Likert inflates apparent agreement and hides criteria drift behind a middle category"
          - "Binary makes the statistics tractable: proportions, TPR/TNR, McNemar"
          - "Names an exception: genuinely ordinal product criteria, or ranking/preference comparisons where relative order is the question"
        reference: |
          A binary decision forces everyone — annotator, PM, judge — to state what actually
          matters, and it produces a label you can act on: a 3 out of 5 tells you nothing about
          whether to ship. The critique written alongside the binary label is the real asset,
          because it is the text you later mine for judge-prompt language and for the failure
          taxonomy; Likert scores carry no such text. Statistically, binary labels give you
          proportions, TPR/TNR on the judge, McNemar for paired comparison, and Wilson intervals —
          all of which are well-behaved at n = 100. Likert also conceals criteria drift: annotators
          park ambiguity in the middle category instead of surfacing that the rubric is
          under-specified. The exceptions are genuinely ordinal product criteria with agreed
          anchors, and preference/ranking comparisons where the question is relative order rather
          than a threshold.
        known_prior: false
        est_minutes: 15
        draft: true
      - id: b1-criteria-drift
        module: b1
        type: explain
        must_cover: false
        prompt: "Explain criteria drift, why it is information rather than noise, and how you handle it mid-annotation."
        rubric:
          - "Defines it: annotators refine what they mean by the criterion in the act of grading"
          - "Cites the EvalGen / Who Validates the Validators result as the source"
          - "States that low inter-annotator agreement usually means the rubric is under-specified, not that the annotators are bad"
          - "Handling: version the rubric, record which version each label was made under, re-label earlier items under the new version"
          - "States the anti-pattern: averaging disagreement away or silently keeping mixed-version labels"
        reference: |
          Criteria drift is the empirical finding from Shankar et al.'s EvalGen work that people
          discover and refine what they mean by a criterion while grading — the first twenty
          examples change the definition the remaining eighty are graded against. It is
          information: the drift is telling you the criterion was under-specified, which is the
          same signal you get from low Cohen's kappa. The handling is version control, not
          suppression. Give the rubric a version number, record the version on every label, and
          when the definition changes materially, re-label the earlier items under the new version
          rather than leaving a mixed-vintage dataset that no TPR/TNR computed on it can be
          trusted. The anti-patterns are averaging disagreement away, and shipping a golden set
          whose labels were made under three different unrecorded definitions.
        known_prior: false
        est_minutes: 15
        draft: true
  - id: b2
    area: evals-found
