    checks:
      - id: a6-recall-before-generation
        module: a6
        type: code
        must_cover: true
        prompt: "Build a synthetic eval set from your own corpus and report recall@k before you touch any generation code."
        rubric:
          - "Questions are generated from real chunks, so each question has a known gold chunk id"
          - "The generation step is not implemented or not called; only retrieval is measured"
          - "recall@k reported for at least two values of k, with the set size stated"
          - "A spot-check confirms the synthetic questions are answerable and not trivially lexical"
          - "The eval set is versioned and committed, not regenerated per run"
        reference: |
          ```python
          # 1. generate a question per sampled chunk -> gold chunk id is known by construction
          def make_case(chunk):
              q = llm(f"Ask one specific question answerable ONLY by this passage:\n{chunk.text}")
              return {"id": f"syn-{chunk.id}", "question": q, "gold_chunk_ids": [chunk.id]}

          cases = [make_case(c) for c in sample_chunks(corpus, n=150, stratify_by="report")]

          # 2. retrieval only - no generation anywhere in this file
          def recall_at_k(cases, retrieve, k):
              hits = 0
              for c in cases:
                  got = {d.id for d in retrieve(c["question"], k=k)}
                  hits += bool(got & set(c["gold_chunk_ids"]))
              return hits / len(cases)

          for k in (1, 5, 10, 20):
              print(k, round(recall_at_k(cases, retrieve, k), 3))
          ```

          Recall@k is the hard ceiling: generation cannot recover a chunk the retriever never
          surfaced. Spot-read 20 generated questions — if they are answerable by keyword overlap
          alone, the set will flatter a BM25 baseline and tell you nothing.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: a6-four-config-table
        module: a6
        type: numeric
        must_cover: true
        prompt: "Show a table of retrieval quality across at least four configurations (naive, +hybrid, +contextual chunks, +reranker) with the cost and latency of each."
        rubric:
          - "Four or more configurations, each a single change from the previous row, on the same eval set"
          - "Quality reported as recall@k (and ideally nDCG), not as a vibe or an end-to-end judge score"
          - "Indexing cost and per-query cost reported separately, in dollars"
          - "Latency reported at p50 and p95, not as a mean"
          - "A stated conclusion naming which config you would ship and why"
        reference: |
          Same 150-case eval set, same corpus, one change per row:

          | config | recall@5 | recall@20 | nDCG@10 | index $ | $/1k queries | p50 ms | p95 ms |
          |---|---|---|---|---|---|---|---|
          | naive dense (top-5) | 0.61 | 0.79 | 0.58 | 0.40 | 0.05 | 40 | 95 |
          | + hybrid BM25 + RRF | 0.72 | 0.87 | 0.68 | 0.40 | 0.06 | 55 | 130 |
          | + contextual chunks | 0.81 | 0.93 | 0.76 | 12.00 | 0.06 | 55 | 130 |
          | + reranker (20 -> 5) | 0.88 | 0.93 | 0.85 | 12.00 | 0.55 | 180 | 420 |

          Read it as: hybrid is nearly free and buys 11 points; contextual chunking costs a
          one-off $12 of indexing (one LLM call per chunk, prompt-cached on the document) and buys
          9 more; the reranker cannot raise recall@20 (it reorders the same candidates) but lifts
          recall@5 and nDCG sharply for 10x the per-query cost and 3x p95. Ship all four for an
          offline/report use case; drop the reranker if a 420 ms p95 breaks the product.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: a6-diagnose-failure
        module: a6
        type: judge
        must_cover: true
        prompt: "Given a wrong answer from your RAG system, diagnose it as a retrieval failure or a generation failure in under five minutes, with evidence."
        rubric:
          - "First test stated: was the gold chunk in the retrieved set at all?"
          - "If absent, it is retrieval; the sub-diagnosis names which retrieval failure (embedding miss, chunk boundary, metadata filter, stale index)"
          - "If present, it is generation; the sub-diagnosis names which (ignored context, partial read, over-summarised, hallucinated citation)"
          - "The evidence is the actual retrieved chunk ids and text, quoted, not a recollection"
          - "The fix named follows from the diagnosis, and differs between the two branches"
        reference: |
          The decision procedure is one question with two branches.

          **Step 1 — was the answer retrievable?** Look at the trace's retrieved chunk ids and
          read them. If the passage containing the true answer is not in the top-k, it is a
          **retrieval** failure; go no further. Sub-diagnose by re-querying: does BM25 find it
          (embedding miss)? Is the answer split across a chunk boundary (chunking)? Was it
          excluded by a metadata filter? Is the index stale?

          **Step 2 — if it was there and the answer is still wrong, it is generation.** Sub-
          diagnose by re-asking the model with *only* the gold chunk: if it now answers correctly,
          the failure is distraction or lost-in-the-middle, and the fix is reranking or fewer
          chunks. If it still answers wrongly, the failure is reading or instruction-following,
          and the fix is prompt or model.

          The fixes do not overlap: retrieval failures are fixed in the index, generation failures
          in the prompt. Diagnosing wrongly means a quarter spent tuning the wrong half.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a6-longcontext-vs-rag
        module: a6
        type: explain
        must_cover: true
        prompt: "Explain when long-context beats RAG and when it does not, in cost terms."
        rubric:
          - "Frames it as corpus size vs window: if the whole relevant corpus fits and is re-used, long context can win"
          - "Gives the cost arithmetic: long context pays per request for the whole corpus; RAG pays once to index and a little per query"
          - "Names prompt caching as the thing that changes the crossover"
          - "Names the quality argument: context rot and distractors make more tokens not monotonically better"
          - "States a concrete decision rule with numbers"
        reference: |
          The comparison is per-request token cost against one-off index cost. Stuffing a 200k-
          token corpus into every request at $3/M input tokens is $0.60 per query; with prompt
          caching on a stable corpus that falls to roughly a tenth on cache hits. RAG pays an
          indexing cost once (embeddings plus, for contextual chunking, one cheap LLM call per
          chunk) and then sends 5k tokens per query, about $0.015. Long context wins when the
          corpus is small, stable, re-used across many turns of one session, and cacheable, and
          when the questions are synthesis-shaped rather than lookup-shaped. RAG wins as soon as
          the corpus exceeds the window, changes often, or is queried by many users with different
          questions — thousands of Sodir reports is the obvious case. Quality cuts the same way:
          context rot means more tokens is not monotonically better.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a6-eight-failure-modes
        module: a6
        type: explain
        must_cover: false
        prompt: "Name the eight RAG failure modes from memory and give the distinguishing symptom of each."
        rubric:
          - "All eight named: retrieval miss, reranker inversion, chunk-boundary severing, lost-in-the-middle, stale index, metadata filter excluding the right doc, parametric-memory override, unanswerable question answered anyway"
          - "Each has a symptom that distinguishes it from the others, not a restatement of the name"
          - "At least three have a named diagnostic you could run"
          - "Distinguishes the retrieval-side modes from the generation-side modes"
          - "Names abstention rate as the metric for the last one"
        reference: |
          **Retrieval side.** *Retrieval miss* — the gold chunk is not in the top-k at any k you
          send; diagnose by checking recall@20 vs recall@5. *Reranker inversion* — recall@20 is
          fine, recall@5 drops after reranking; the cross-encoder demoted the right chunk.
          *Chunk-boundary severing* — the answer spans two chunks and neither alone supports it;
          the symptom is a half-correct answer. *Stale index* — the answer is right for an older
          version of the document. *Metadata filter excluding the right doc* — recall collapses
          only for filtered queries; diagnose by re-running with filters off.

          **Generation side.** *Lost in the middle* — the gold chunk was retrieved but sat at
          position 8 of 10; re-ask with only that chunk and it answers correctly. *Parametric
          memory override* — the model answers from pretraining and ignores contradicting context;
          the symptom is a plausible, generic answer with no citation. *Unanswerable question
          answered anyway* — there is no supporting chunk and it answers regardless; the metric is
          abstention rate on a deliberately unanswerable slice.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a6-hybrid-rrf
        module: a6
        type: derive
        must_cover: false
        prompt: "Write the reciprocal rank fusion formula, compute a fused ranking for two short result lists by hand, and explain why RRF is used instead of score normalisation."
        rubric:
          - "States RRF(d) = sum over rankers of 1/(k + rank(d)), with k typically 60"
          - "Works a concrete example with at least two lists and shows the resulting order"
          - "Explains that BM25 and cosine scores are on incomparable scales, so normalising requires per-query calibration"
          - "Notes that RRF uses only ranks, so it is robust to scale and to outlier scores"
          - "Names the cost: RRF throws away score magnitude, so a very confident single hit is not rewarded"
        reference: |
          ```
          RRF(d) = Σ_r  1 / (k + rank_r(d)),     k = 60 by convention
          ```

          BM25 list: `[A, B, C]`. Dense list: `[C, A, D]`.

          ```
          A: 1/61 + 1/62 = 0.016393 + 0.016129 = 0.032522
          C: 1/63 + 1/61 = 0.015873 + 0.016393 = 0.032266
          B: 1/62                              = 0.016129
          D: 1/63                              = 0.015873
          fused: A, C, B, D
          ```

          BM25 scores are unbounded sums of tf-idf terms and cosine similarities live in [-1, 1];
          the two are not on a common scale, and the mapping between them changes per query, so
          min-max or z-score normalisation needs per-query calibration and is unstable when one
          list is short. RRF ignores magnitude entirely and uses only rank, which is why it is
          robust and needs no tuning beyond `k`. The price is exactly that: a ranker that is
          overwhelmingly confident about its top hit gets no more credit than one that is barely
          confident, so RRF slightly under-weights a strong lexical exact-match.
        known_prior: false
        est_minutes: 25
        draft: true
  - id: b0
    area: evals-found
