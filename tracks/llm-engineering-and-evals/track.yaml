        kind: doc
        url: https://docs.claude.com/en/docs/build-with-claude/prompt-caching
        est_minutes: 150
      - id: a4-huyen-ch9
        title: "Chip Huyen, AI Engineering chapter 9 (inference optimisation, model routing)"
        kind: book
        url: https://www.oreilly.com/library/view/ai-engineering/9781098166298/
        est_minutes: 210
        length: 60
        unit: pages
    checks:
      - id: a4-prefill-decode
        module: a4
        type: explain
        must_cover: true
        prompt: "Explain why the first token is compute-bound and the rest are memory-bandwidth-bound, and what that implies for batching."
        rubric:
          - "Prefill processes all prompt tokens at once, so the matmuls are matrix-matrix and arithmetic intensity is high"
          - "Decode processes one token per sequence, so the same weights are streamed for a single vector: matrix-vector, low arithmetic intensity"
          - "Names the ratio of FLOP/s to memory bandwidth as the quantity that decides which regime you are in"
          - "Batching helps decode a lot (weights amortised across sequences) and helps prefill little"
          - "Draws the consequence: continuous batching, and TTFT vs inter-token latency being different problems"
        reference: |
          During prefill the whole prompt goes through the model at once, so every weight matrix is
          multiplied by a matrix of many token vectors: arithmetic intensity is high, the GPU's
          FLOP/s is the binding constraint, and time scales with prompt length. During decode each
          sequence contributes one token per step, so the same weight matrices are streamed from
          HBM to be multiplied by a single vector. A modern accelerator has on the order of a
          thousand FLOPs of compute per byte of bandwidth, so a matrix-vector product leaves the
          arithmetic units almost idle and the step time is set by how fast the weights can be
          read. The implication is that batching is the decode fix and barely a prefill fix:
          batching 32 sequences reads each weight once and uses it 32 times, so throughput rises
          nearly linearly while per-token latency barely moves. Hence continuous batching, and
          hence time-to-first-token and inter-token latency being two separate engineering
          problems.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a4-kv-cache-size
        module: a4
        type: numeric
        must_cover: true
        prompt: "Compute, on paper, the KV cache size in GB for a given model, context and batch."
        rubric:
          - "Formula stated: 2 * n_layer * n_kv_heads * d_head * seq_len * batch * bytes_per_element"
          - "The factor 2 explained as K and V, and n_kv_heads distinguished from n_heads for GQA"
          - "Arithmetic shown with units, ending in GB"
          - "Compared with the weight memory on the target GPU, so the remaining headroom is explicit"
          - "States the linear scaling in both batch and sequence length"
        reference: |
          ```
          KV bytes = 2 × n_layer × n_kv_heads × d_head × seq_len × batch × bytes_per_element
          ```

          8B model, `n_layer = 36`, `n_kv_heads = 8` (GQA), `d_head = 128`, bf16 (2 bytes),
          `seq_len = 32,768`, `batch = 16`:

          ```
          per token per sequence = 2 × 36 × 8 × 128 × 2 bytes = 147,456 B ≈ 144 KiB
          × 32,768 tokens                                     = 4.83 GB per sequence
          × 16 sequences                                      = 77.3 GB
          ```

          On an 80 GB H100 the bf16 weights alone are ~16 GB, leaving ~64 GB — so this
          configuration does not fit; batch 12 (58 GB) does, with little room for activations.
          Both scalings are linear: doubling context or doubling batch doubles the cache. That is
          the whole reason GQA, KV quantization and PagedAttention exist.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a4-double-context
        module: a4
        type: explain
        must_cover: true
        prompt: "Say what breaks first when you double the context length, and in what order."
        rubric:
          - "KV cache memory doubles, so the maximum batch roughly halves at fixed memory: throughput is the first casualty"
          - "Prefill time grows superlinearly because of the quadratic attention term, so TTFT degrades"
          - "Names the eviction / preemption behaviour of the server when memory is exhausted, not just OOM"
          - "Quality degradation (context rot, middle-of-context recall) named as the non-mechanical failure"
          - "Orders the failures rather than listing them"
        reference: |
          In order. First, KV cache memory doubles, so at fixed GPU memory the maximum concurrent
          batch roughly halves — the visible symptom is not an error but a throughput collapse, as
          the scheduler admits fewer sequences and queues the rest. Second, under pressure a server
          like vLLM starts preempting and recomputing evicted sequences, so tail latency spikes
          erratically before anything actually fails. Third, prefill time grows faster than
          linearly because the attention term is quadratic in sequence length, so time-to-first-
          token degrades noticeably even when memory is fine. Fourth, and only then, you hit an
          out-of-memory error. Running alongside all of this is the non-mechanical failure:
          retrieval from the middle of the window gets worse, so the system can be slower, more
          expensive and *less* accurate at the longer context.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a4-quantize-ship
        module: a4
        type: judge
        must_cover: true
        prompt: "Quantize a model, report the perplexity and latency delta, and state whether you would ship it."
        rubric:
          - "A named scheme and tool (FP8, AWQ or GPTQ via LLM Compressor; GGUF for local)"
          - "Perplexity measured on a held-out corpus for both base and quantized, with the corpus named"
          - "Task-level quality measured too, not only perplexity, on the golden set"
          - "Throughput, latency and memory reported for both"
          - "A ship / don't-ship decision with a stated threshold, decided in advance"
        reference: |
          ```python
          from llmcompressor.transformers import oneshot
          from llmcompressor.modifiers.quantization import GPTQModifier

          oneshot(model="Qwen/Qwen3-8B", dataset="open_platypus", num_calibration_samples=512,
                  recipe=GPTQModifier(targets="Linear", scheme="W4A16", ignore=["lm_head"]),
                  output_dir="qwen3-8b-w4a16")
          ```

          ```
                          ppl (wikitext)   golden macro-F1   p95 ms   mem
          bf16                  7.41            0.862          350    16.1 GB
          FP8 (W8A8)            7.43            0.861          235     8.4 GB
          AWQ/GPTQ (W4A16)      7.62            0.848          180     5.2 GB
          ```

          Pre-registered threshold: ship if golden-set macro-F1 drops by less than 0.01 and no
          failure mode drops more than 3 points. **FP8 ships** — 0.001 of quality for a third off
          latency and half the memory. **W4A16 does not**: 0.014 is over the bound, and the drop is
          concentrated in the rarest NPT classes. Perplexity alone would have passed W4A16, which
          is the reason task-level evaluation is not optional.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a4-vllm-loadtest
        module: a4
        type: code
        must_cover: true
        prompt: "Stand up vLLM, load-test it, and produce a chart of throughput vs p99 latency vs concurrency."
        rubric:
          - "vLLM serving with the config stated: model, dtype, max model len, GPU memory utilisation"
          - "A load generator sweeping concurrency, with a fixed prompt/output length distribution"
          - "Throughput (output tokens/s and requests/s) and p50/p99 latency both recorded per concurrency level"
          - "The knee of the curve identified, where p99 starts rising faster than throughput"
          - "Prefix-caching and continuous-batching effects visible in the metrics, not assumed"
        reference: |
          ```bash
          vllm serve Qwen/Qwen3-8B --max-model-len 8192 --gpu-memory-utilization 0.90 \
                     --enable-prefix-caching

          for c in 1 2 4 8 16 32 64 128; do
            guidellm benchmark --target http://localhost:8000/v1 --model Qwen/Qwen3-8B \
              --rate-type concurrent --rate $c \
              --data "prompt_tokens=1024,output_tokens=256" --max-seconds 120 \
              --output-path results/c$c.json
          done
          ```

          ```
          conc   req/s   out tok/s   p50 ms   p99 ms
             1    0.72       184      1,390    1,520
             8    4.90     1,254      1,630    2,010
            32   14.10     3,610      2,270    3,940
            64   17.80     4,557      3,590    7,820   <- knee
           128   18.40     4,710      6,950   19,400
          ```

          Read the knee: past 64, throughput gains ~3% while p99 nearly triples — the scheduler is
          queueing and preempting. Check the server's own metrics for prefix-cache hit rate and
          running/waiting queue depth to confirm the mechanism rather than inferring it.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: a4-cost-model
        module: a4
        type: numeric
        must_cover: true
        prompt: "Write a cost model for your app in $/1k requests and name the three biggest levers."
        rubric:
          - "The model is an equation in measured quantities: input tokens, output tokens, cache-hit share, prices"
          - "Computed for a real feature with real measured token counts"
          - "Self-hosted alternative costed on GPU-hour and achieved throughput, so the crossover volume is visible"
          - "Three levers named and each quantified, not just listed"
          - "States the sensitivity: which lever dominates at this app's token profile"
        reference: |
          ```
          $/1k req = 1000 × [ T_in,uncached·p_in + T_in,cached·p_cache + T_out·p_out ]
          ```

          Measured profile: `T_in = 9,570` of which 2,530 cacheable, `T_out = 420`,
          `p_in = $5/M`, `p_cache = $0.5/M`, `p_out = $25/M`.

          ```
          uncached in : 7,040 × 5e-6      = $0.0352
          cached in   : 2,530 × 0.5e-6    = $0.0013
          output      :   420 × 25e-6     = $0.0105
          per request                      = $0.0470   ->  $47.0 / 1k requests
          ```

          Self-hosted crossover: an H100 at $2/h sustaining 4,557 output tok/s and ~17 req/s costs
          `2 / (17 × 3600) × 1000 = $0.033 / 1k requests` — so self-hosting wins above roughly
          400k requests/month, before counting the ops burden.

          **Levers, quantified for this profile.** (1) Retrieved-context size: 5,200 of the 7,040
          uncached input tokens, so top-5 to top-3 saves ~$14/1k. (2) Prompt caching coverage:
          moving the few-shot block behind the cache breakpoint saves ~$4/1k. (3) Model routing:
          55% of traffic is lookup-shaped and answerable by a model at 1/8 the price, ~$20/1k.
          Routing dominates here because output is short; on a long-output feature, output
          discipline would dominate instead.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a4-prompt-caching-savings
        module: a4
        type: numeric
        must_cover: false
        prompt: "Compute the break-even hit rate for prompt caching given the write premium and the read discount, and say where to place the cache breakpoint."
        rubric:
          - "States the two prices: a cache write costs more than a normal input token, a cache read costs much less"
          - "Sets up the break-even equation and solves for the hit rate"
          - "Works a number with concrete prices"
          - "Explains breakpoint placement: everything before the breakpoint must be byte-identical across requests"
          - "Names what silently breaks a cache: a timestamp, a reordered tool list, a per-user string near the top"
        reference: |
          Let `w` be the write multiplier (e.g. 1.25x base input price) and `d` the read multiplier
          (e.g. 0.1x). With hit rate `h`, cost per cached token relative to no caching is
          `(1-h)·w + h·d`. Break-even against 1.0:

          ```
          (1-h)w + hd = 1
          h = (w - 1) / (w - d) = (1.25 - 1) / (1.25 - 0.1) = 0.25 / 1.15 = 0.217
          ```

          So caching pays above about a **22% hit rate**; at 90% it costs `0.1×0.9 + 1.25×0.1 =
          0.215`, a ~78% saving on the cached span.

          Placement: everything before the breakpoint must be byte-identical across requests, so
          order the prompt **system, tool schemas, few-shot, [breakpoint], retrieved context,
          history, user turn**. The classic silent killers are a timestamp or request id in the
          system prompt, a tool list whose order varies with a dict iteration, and a per-user name
          placed above the breakpoint — each drops the hit rate to zero while the code still looks
          correct, so monitor the reported cache-read token share rather than assuming.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a4-routing-policy
        module: a4
        type: explain
        must_cover: false
        prompt: "Design a routing policy that sends easy requests to a small model, and say how you would prove it does not regress quality."
        rubric:
          - "The routing signal is named and cheap: a classifier, a heuristic on query shape, or retrieval confidence"
          - "An escalation path exists: the small model can defer or be overridden on a verifier failure"
          - "The router itself is evaluated, with its own confusion matrix on routed-wrongly cases"
          - "Quality proven per segment, not in aggregate, because routing moves quality unevenly"
          - "The cost saving and the added latency of the routing hop both reported"
        reference: |
          Route on a cheap signal computed before generation: a small classifier over the query
          (lookup vs multi-hop vs comparison), plus retrieval confidence — a single high-scoring
          chunk with a large margin is the easy case. Send easy traffic to the small model, with
          two escape hatches: the small model may emit `DEFER`, and a code-based verifier (citation
          resolves, schema valid) escalates automatically on failure. Then evaluate the router as
          its own component: build a confusion matrix of routed-small versus should-have-been-large,
          because a router with 95% accuracy on 55% of traffic still misroutes 3% of everything.
          Prove quality per segment rather than in aggregate — routing typically leaves the
          aggregate flat while degrading one segment badly, and the aggregate hides it. Report both
          sides: ~$20 per 1k requests saved, and +120 ms p50 from the classifier hop, which is a
          real cost for an interactive feature.
        known_prior: false
        est_minutes: 25
        draft: true

  - id: cap-writeup
    area: evals-prod
    phase: p7
    track: shared
    title: "Write-up & publish"
    weeks: [37, 40]
    budget_hours: 30
    prerequisites: [a2, a3, a4]
    topics:
      - id: writeup
        title: A 2,000-3,000 word write-up led by the failure taxonomy
        summary: Lead with what broke and what you did about it, not with the architecture diagram.
        kind: idea
        resources: [cw-hamel-eval-smell]
        checks: [cw-writeup-2500]
      - id: arc
        title: 'The arc: system, traces, evaluators, calibration, stats, swap, limits'
        summary: Each section earns the next one, and the last two are the limits and the total eval cost.
        kind: idea
        resources: [cw-field-guide]
        checks: [cw-limits-of-numbers, cw-total-eval-cost]
      - id: readme
        title: A README a stranger can reproduce
        summary: 'Verified the only way it can be: by running it on a clean machine.'
        kind: idea
        checks: [cw-readme-reproducible]
      - id: public-post
        title: A public post going deep on one failure mode
        summary: One mode, the numbers behind it, and what changed once you fixed it.
        kind: idea
        checks: [cw-public-post]
      - id: anti-patterns
        title: The anti-patterns that sink the artefact
        summary: Audit your own repo against the named list and say, for each, why it does not apply.
        kind: idea
        resources: [cw-hamel-evals-index, cw-anthropic-demystifying]
        checks: [cw-anti-patterns]
    resources:
      - id: cw-hamel-eval-smell
        title: "Hamel Husain, 'It's Hard to Eval' Is a Product Smell"
        kind: doc
        url: https://hamel.dev/blog/posts/eval-smell/
        est_minutes: 45
      - id: cw-hamel-evals-index
        title: "Hamel Husain, LLM evals notes index"
        kind: doc
        url: https://hamel.dev/notes/llm/evals/
        est_minutes: 60
      - id: cw-anthropic-demystifying
        title: "Anthropic, Demystifying evals for AI agents (the Swiss cheese model and complementary methods)"
        kind: doc
        url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
        est_minutes: 60
      - id: cw-field-guide
        title: "Hamel Husain, A Field Guide to Rapidly Improving AI Products"
        kind: doc
        url: https://hamel.dev/blog/posts/field-guide/
        est_minutes: 60
    checks:
      - id: cw-writeup-2500
        module: cap-writeup
        type: explain
        must_cover: true
        prompt: "Ship a 2,000-3,000 word write-up led by the taxonomy rather than the architecture, following the required arc."
        rubric:
          - "The failure taxonomy appears in the first 300 words; the architecture is subordinate to it"
          - "The arc is complete: system and why it is hard to evaluate, what 100+ traces revealed, evaluator design, calibration, statistics and where they break, model-swap result, limitations, total eval cost"
          - "Every claim is backed by a number with an interval, and every number names the dataset version it came from"
          - "Written for a hiring manager who will skim: informative headings, one table per section at most"
          - "Word count inside 2,000-3,000, checked"
        reference: |
          The structure, in order, with a rough budget:

          1. **The system and why it is hard to evaluate** (300 w). One paragraph on what it does,
             then the hard part: there is no single right answer, the ground truth is in a
             1,500-page PDF, and "correct" means page-level attribution.
          2. **What 100+ traces revealed** (450 w). The taxonomy table with counts. Lead here —
             this is the section that distinguishes the artefact.
          3. **Evaluator design** (400 w). Which criteria went to code, which to a judge, and why.
          4. **Calibration** (450 w). TPR/TNR, the confusion matrix, bias checks, the corrected
             pass rate, and the PM-facing explanation of the gap.
          5. **Statistics and where they break** (350 w). Clustering, the width of the interval,
             what you could not conclude.
          6. **Model-swap result** (350 w). Paired comparison, the re-calibration, the decision.
          7. **Limitations and what the numbers cannot tell you** (300 w).
          8. **Total cost of the eval runs** (150 w).

          The test of the lead: if the first screen describes a pipeline diagram instead of a
          failure mode, rewrite it.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: cw-readme-reproducible
        module: cap-writeup
        type: code
        must_cover: true
        prompt: "Write a README a stranger can actually reproduce from, and verify it by running it on a clean machine."
        rubric:
          - "Evaluation appears before the app description, not three paragraphs in"
          - "One command to install, one to run the eval suite, one to reproduce the headline number"
          - "Data acquisition documented, including licences (Sodir NLOD) and what cannot be redistributed"
          - "Pinned dependencies and a stated Python version; secrets documented but not required for the offline suite"
          - "Actually tested from a clean clone on a clean machine, and the run time and cost stated"
        reference: |
          The README, in outline:

          > **# Well-report QA, with the evals that say whether it works**

          > **Headline:** corrected pass rate 0.81 (95% CI [0.74, 0.87]) on golden-v1.2.0,
          > judge TPR 0.94 / TNR 0.73 on a 100-example held-out human set.
          > Failure taxonomy, calibration report and CI gate below.

          > ## Reproduce

          ```bash
          git clone ... && cd well-report-qa
          uv sync                                  # Python 3.12, pinned
          make data                                # downloads Sodir PDFs (NLOD), ~20 min, 4 GB
          make evals                               # offline suite, 180 cases, ~6 min, ~$1.20
          make report                              # regenerates every table in the write-up
          ```

          Then verify it: clone into an empty container, run the three commands, and fix everything
          that fails. State the run time and the dollar cost, note that `make evals` uses cached
          model responses by default (`EVAL_NO_CACHE=1` to re-run live), and say plainly which
          sources cannot be redistributed — Sodir data is NLOD, but PetroWiki and NORSOK are not,
          so they are linked, never ingested.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: cw-public-post
        module: cap-writeup
        type: explain
        must_cover: true
        prompt: "Publish a post going deep on one failure mode, with numbers."
        rubric:
          - "One failure mode only, chosen because it is the most interesting rather than the most frequent"
          - "The mechanism explained, not just the symptom, with a real trace quoted"
          - "Numbers: how often it occurred, what the fix changed, with an interval"
          - "Generalises honestly: what transfers to other domains and what does not"
          - "Published somewhere public and linked from the repo README"
        reference: |
          The shape that works: pick the mode with the best mechanism story, not the biggest count.
          Open with a real trace, quoted, where the system did something a reader would not have
          predicted. Explain the mechanism — for the report-QA system, *an empty tool result read
          as evidence of absence*: the retriever returned nothing because identifiers are not in
          the prose index, and the agent concluded the well had no report. Then the numbers: it
          accounted for 16 of 70 failures (23%), and returning a hint string in the empty result
          cut it to 2 of 68 on the next run, a change of -0.20 [-0.31, -0.09]. Then be honest about
          generality: the specific fix is a tool-description problem, but the general lesson —
          that agents treat empty results as facts — is the transferable part. Hiring managers
          report that one public post going deep on one failure mode beats three certificates.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: cw-limits-of-numbers
        module: cap-writeup
        type: explain
        must_cover: true
        prompt: "Write the limitations section: what the numbers cannot tell you."
        rubric:
          - "Names the golden set's coverage gaps and that a pass rate on a stratified diagnostic set is not a production rate"
          - "Names judge error that survives correction, and the width of the interval driven by a small calibration set"
          - "Names the single-annotator design and what that costs"
          - "Names what was not measured at all: real user satisfaction, downstream decision quality, long-tail queries"
          - "Written as a claim-limiting section, not a disclaimer, and it names what would fix each limitation"
        reference: |
          The numbers say that on 180 stratified cases drawn from 40 Norwegian end-of-well reports,
          a calibrated judge estimates 81% of answers are fully supported by the cited page, with a
          95% interval of 7 points. They do not say the production rate is 81%: the set is
          deliberately over-weighted toward failure-prone segments. They do not remove judge error;
          they correct for the part measured on 100 labels, of which only 15 were negatives, which
          is why the interval is 7 points wide and not 3. One annotator labelled everything, so
          there is no agreement figure and any systematic misreading of the rubric is invisible.
          Three things were not measured at all: whether an engineer trusts the answer, whether the
          answer changes a decision correctly, and behaviour on the long tail of queries nobody
          thought to write down. Each has a fix — production sampling, a decision-level study, a
          second annotator — and none of them is cheap.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: cw-total-eval-cost
        module: cap-writeup
        type: numeric
        must_cover: true
        prompt: "Report the total cost of the eval runs across the project, broken down."
        rubric:
          - "Costs pulled from the harness's own per-run cost accounting, not reconstructed from a bill"
          - "Broken down by activity: trace generation, judge calls, CI runs, agent trials, human time"
          - "Human hours counted and valued, or at least stated, alongside the dollar cost"
          - "Cost per eval run and cost per golden-set case stated, so the figure is reusable"
          - "One sentence on what would make it cheaper next time"
        reference: |
          | activity | runs | $ | note |
          |---|---|---|---|
          | trace generation for error analysis | 1 × 300 | 12.40 | frontier model, uncached |
          | judge calls, iteration (dev split) | 41 × 100 | 61.50 | biggest single line |
          | judge calls, held-out (once per version) | 6 × 100 | 9.00 | |
          | CI regression runs | 128 × 180 | 34.60 | ~85% cache hits |
          | agent trials, pass^5 | 5 × 60 tasks × 3 | 88.20 | most expensive per run |
          | model-swap requalification | 2 × 180 + labels | 21.30 | |
          | **total model spend** | | **227.00** | |
          | human annotation | 31 h | — | 220 labels + 120 traces read |

          That is **$1.26 per golden-set case per full suite run** and about **$0.27 per CI run**
          net of caching. What would make it cheaper: cache the judge as aggressively as the
          system (judge calls were re-run on every prompt tweak, and roughly a third were
          identical), and sample rather than run all 180 cases on every PR.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: cw-anti-patterns
        module: cap-writeup
        type: judge
        must_cover: false
        prompt: "Audit your own repo against the named anti-patterns and state, for each, why it does not apply."
        rubric:
          - "All seven anti-patterns checked: Ragas wrapper with defaults, raw judge rate reported as the system's, Likert judge with no human comparison, benchmark scores as evidence, eval set written from imagination, point estimates without intervals, README that buries evaluation"
          - "Each check cites the specific artefact that refutes it, with a file or section reference"
          - "At least one is answered honestly as 'partly applies', with the remediation stated"
          - "The audit is in the repo, not only in the learner's head"
          - "Distinguishes anti-patterns avoided by design from ones avoided by accident"
        reference: |
          | anti-pattern | verdict | evidence |
          |---|---|---|
          | Ragas wrapper, default metrics, no calibration | avoided | `evals/judges/faithfulness_v2.py`; Ragas used as a baseline only, table in write-up §3 |
          | raw judge pass rate reported as the system's | avoided | every headline number is Rogan-Gladen corrected; `report.py` refuses to print an uncorrected rate |
          | Likert judge with no human comparison | avoided | binary judge, 100-example held-out human set, confusion matrix in §4 |
          | benchmark scores as evidence | avoided | no public benchmark number appears in the README |
          | eval set written from imagination | **partly applies** | 60% synthetic; grounded in real chunks, but pass rates by provenance differ by 6 points — flagged in §7, remediation is more real traces |
          | point estimates without intervals | avoided | every table carries a 95% CI; clustering unit stated |
          | README describes the app before mentioning evaluation | avoided | README line 3 is the headline eval number |

          Keep the audit in the repo as `EVAL_AUDIT.md` — a reviewer reading it learns more about
          the work than the architecture diagram tells them.
        known_prior: false
        est_minutes: 30
        draft: true

capstone:
  - id: cap-golden-set
    title: "Golden dataset"
    modules: [b2]
    description: "150-300 labelled examples with documented provenance, a stated real/synthetic split, a held-out judge test slice, versioned with a data card."
  - id: cap-failure-taxonomy
    title: "Failure taxonomy"
    modules: [b1]
    description: "5-9 failure categories with counts, derived from at least 100 hand-read traces, with the raw open codes shown alongside the axial categories."
  - id: cap-evaluators
    title: "Evaluators and judge calibration report"
    modules: [b3, b1]
    description: "At least three code-based scorers plus one LLM judge with its prompt history, and a calibration report carrying TPR/TNR with CIs, a confusion matrix, position- and verbosity-bias checks, and a Rogan-Gladen corrected pass rate with a bootstrap CI."
  - id: cap-harness
    title: "Eval harness with a CI gate"
    modules: [b9, b6]
    description: "One-command harness with deterministic case ids that records model, prompt version and commit SHA, caches calls, reports cost and latency per case, emits a diff report with per-failure-mode deltas, shows a green CI run plus a deliberately broken PR firing the gate, and is ported to Inspect AI."
  - id: cap-rag-agent-metrics
    title: "RAG and agent metrics"
    modules: [b4, b5, a6, a7]
    description: "recall@k and nDCG on a labelled retrieval set, a calibrated faithfulness judge, a trajectory scorer, tool-call correctness, a terminal-state check, pass^k at k=5 with a CI, and an abstention rate on unanswerable questions."
  - id: cap-safety-slice
    title: "Safety slice"
    modules: [b7, a8]
    description: "At least 20 adversarial cases spanning direct injection, indirect injection via retrieved content, PII extraction and refusal probes, each mapped to an OWASP GenAI 2026 category with a severity."
  - id: cap-model-swap
    title: "Model-swap requalification"
    modules: [b6, b8]
    description: "A paired comparison with a CI (McNemar), the judge re-calibrated on the new model's outputs, and a ship / don't-ship memo with guardrail thresholds."
  - id: cap-writeup-report
    title: "Write-up"
    modules: [cap-writeup]
    description: "A 2,000-3,000 word public write-up led by the taxonomy: system and why it is hard to evaluate, what the traces revealed, evaluator design, calibration, statistics and where they break, the model-swap result, limitations, and the total cost of the eval runs."
