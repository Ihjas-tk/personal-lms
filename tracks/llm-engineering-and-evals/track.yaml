        kind: doc
        url: https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview
        est_minutes: 180
    checks:
      - id: a5-token-budget
        module: a5
        type: numeric
        must_cover: true
        prompt: "Account for every token in your production prompt and say what each block buys."
        rubric:
          - "A table of blocks (system, tool schemas, few-shot, retrieved context, history, user turn) with measured token counts, not estimates"
          - "Counts come from the provider's tokenizer or token-count endpoint, not from a word count"
          - "Each block has a stated purpose and a stated cost consequence"
          - "Identifies the largest block and what would be lost by halving it"
          - "Notes which blocks are cacheable and where the cache breakpoint sits"
        reference: |
          ```python
          import anthropic
          client = anthropic.Anthropic()

          blocks = {
              "system": SYSTEM,
              "tool_schemas": json.dumps(TOOLS),
              "few_shot": FEW_SHOT,
              "retrieved": "\n\n".join(chunks),
              "history": render(history),
              "user_turn": user_text,
          }
          for name, text in blocks.items():
              n = client.messages.count_tokens(
                  model="claude-opus-5",
                  messages=[{"role": "user", "content": text}],
              ).input_tokens
              print(f"{name:>14}: {n:>6}")
          ```

          A worked example for a RAG turn:

          | block | tokens | what it buys | cacheable |
          |---|---|---|---|
          | system | 480 | role, refusal policy, citation format | yes |
          | tool schemas | 1,150 | retriever + SQL tool | yes |
          | few-shot | 900 | citation format compliance | yes |
          | retrieved chunks | 5,200 | the answer itself | no |
          | history | 1,800 | follow-up resolution | partially |
          | user turn | 40 | the question | no |
          | **total** | **9,570** | | 2,530 cached |

          Retrieval is 54% of the prompt; halving it to top-3 costs recall@k, which is the one
          number that caps end-to-end quality, so cut history and few-shot first.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a5-schema-validity
        module: a5
        type: code
        must_cover: true
        prompt: "Get a 100% valid-schema rate on structured output under adversarial inputs, and show the harness that proves it."
        rubric:
          - "A schema defined once (pydantic or JSON Schema) and reused by both the caller and the validator"
          - "An adversarial input set: injections, empty inputs, very long inputs, unicode, prompts that ask for prose"
          - "Validity measured as a rate over the whole set, with failures shown, not asserted"
          - "A retry-with-validation-error loop, or constrained decoding, as the mechanism that closes the gap"
          - "States what is still not guaranteed: schema validity is not semantic correctness"
        reference: |
          ```python
          from pydantic import BaseModel, Field, ValidationError
          import instructor, anthropic

          class WellFact(BaseModel):
              wellbore: str = Field(min_length=3)
              total_depth_m: float | None
              page: int = Field(ge=1)

          client = instructor.from_anthropic(anthropic.Anthropic())

          def extract(text: str) -> WellFact:
              return client.messages.create(          # retries on ValidationError,
                  model="claude-opus-5",              # feeding the error back to the model
                  max_retries=3,
                  response_model=WellFact,
                  max_tokens=512,
                  messages=[{"role": "user", "content": text}],
              )

          ok = 0
          for case in ADVERSARIAL:                    # injections, empty, 50k chars, emoji, "reply in prose"
              try:
                  extract(case); ok += 1
              except ValidationError as e:
                  print("FAIL", case[:60], e)
          print(f"schema validity {ok}/{len(ADVERSARIAL)}")
          ```

          Constrained decoding (Outlines, or vLLM's guided-decoding backend) reaches 100% by
          construction because invalid tokens are masked at the sampler. Either way, 100% schema
          validity says nothing about whether `page` is the *right* page.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: a5-structured-output-modes
        module: a5
        type: explain
        must_cover: true
        prompt: "Explain the difference between prompting-for-JSON, function calling, and constrained decoding at the sampler."
        rubric:
          - "Prompting-for-JSON: instruction only, no enforcement; failure modes are prose preambles, markdown fences, truncation"
          - "Function calling: the provider trains and formats for tool schemas; validity is high but still probabilistic, and the schema is coerced server-side"
          - "Constrained decoding: a grammar or FSM masks the logits so invalid tokens cannot be sampled; validity is guaranteed by construction"
          - "States the cost: constrained decoding needs logit access (self-hosted or a provider feature) and can distort the distribution"
          - "States that none of the three makes the content correct"
        reference: |
          Prompting for JSON is an instruction and nothing more: the model may still emit a
          preamble, a markdown fence, or a truncated object, and validity is whatever the model
          happens to do. Function calling moves the schema into the provider's own trained
          surface — the model was post-trained to emit tool calls, the arguments are parsed and
          type-checked server-side, and validity is high — but it is still sampling, so a
          sufficiently odd input can still produce a malformed or semantically empty call.
          Constrained decoding is categorically different: a grammar or finite-state machine
          derived from the schema masks the logits at each step, so tokens that would break the
          schema have zero probability and invalid output is impossible by construction. The
          price is that you need logit access, the mask costs a little latency, and forcing the
          grammar can distort the distribution — a model pushed into a field it did not want to
          fill will invent a value. None of the three makes the content true.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a5-tool-description
        module: a5
        type: explain
        must_cover: true
        prompt: "Show a tool description the model uses correctly on the first try, and explain what you changed after watching it fail."
        rubric:
          - "Before and after versions of the description are both shown"
          - "The failure is a real observed trace, quoted, not a hypothetical"
          - "The change is specific: named parameter semantics, units, an example call, an explicit when-not-to-use clause, or a narrowed return shape"
          - "Explains why the model made the earlier mistake in terms of what the description did not say"
          - "Notes that the description is part of the prompt and costs tokens in every turn"
        reference: |
          The discipline is: write the description, run the agent, read the traces, and change the
          description only in response to an observed failure. A worked example. The first version
          of a `search_reports(query, limit)` tool said "search end-of-well reports". The model
          called it with `query="6506/3-1"` and got nothing, because the index is over prose and
          the wellbore id lives in metadata. The fix was not a better model: it was adding
          "`query` is matched against report *text*; to filter by wellbore use `wellbore_id`
          instead — a query that is only an identifier will return nothing", plus one worked
          example call. Anthropic's finding is that tool descriptions behave like prompts for a
          new hire: state the units, state the failure mode, state when *not* to call it, and
          return a compact result rather than a raw dump. Every word is re-sent every turn, so
          the description is also a standing token cost.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a5-compaction
        module: a5
        type: explain
        must_cover: true
        prompt: "Describe a compaction strategy for a 200-turn session and say what information you accept losing."
        rubric:
          - "Names a trigger: a token threshold or a turn count, not 'when it feels long'"
          - "Distinguishes what is summarised from what is kept verbatim (system, tool schemas, the last k turns, pinned facts)"
          - "Uses an external store (notes file, scratchpad, database) for anything that must survive compaction exactly"
          - "States explicitly what is accepted as lost: exact wording of old turns, the order of superseded intermediate reasoning"
          - "Names the risk: compaction can drop a constraint the user set 150 turns ago, so constraints are pinned rather than summarised"
        reference: |
          Trigger compaction at a token threshold (say 70% of the window), not a turn count.
          Keep verbatim: the system prompt, the tool schemas, an explicit pinned-constraints block,
          and the last 5-10 turns. Everything older is replaced by a structured summary written by
          the model into a fixed template — decisions taken, facts established with their sources,
          open questions, and constraints — and anything that must survive exactly is written to an
          external note file the agent can re-read, so the context window is a cache rather than
          the memory. What I accept losing: the exact wording of old turns, superseded intermediate
          reasoning, and tool outputs already distilled into facts. The dangerous loss is a
          constraint stated once at turn 12 ("never write to production"), which is why constraints
          are pinned into a never-summarised block rather than trusted to the summary.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a5-context-rot
        module: a5
        type: explain
        must_cover: false
        prompt: "Explain context rot and why 1M-token windows made context curation more important rather than less."
        rubric:
          - "Defines context rot: retrieval and instruction-following quality degrading as the context grows, even well inside the stated limit"
          - "Names at least one mechanism: attention as a finite budget spread over more tokens, lost-in-the-middle position effects, or distractor-induced errors"
          - "States that the stated window is a capacity limit, not a quality guarantee"
          - "Draws the engineering consequence: retrieve less and better, and place the decisive material deliberately"
          - "Does not claim long context makes RAG obsolete; frames it as a cost and precision trade"
        reference: |
          Context rot is the observation that a model's ability to use its context degrades as
          that context grows, well before the nominal limit is reached. The mechanisms are
          additive: attention is a finite budget spread across every token, so each additional
          irrelevant chunk dilutes it; position effects mean material in the middle of a long
          context is recalled less reliably than material at either end; and distractors that are
          topically similar but wrong actively pull the answer. The practical reading is that a
          1M-token window is a capacity limit, not a quality guarantee — it lets you make a worse
          decision more expensively. So the discipline goes the other way: retrieve fewer, higher-
          precision chunks, rerank before you send, put the decisive material where it will be
          attended to, and compact aggressively. Long context does not kill retrieval; it changes
          retrieval's job from "fit it in" to "only send what earns its place".
        known_prior: false
        est_minutes: 20
        draft: true

  - id: a6
    area: context-rag
    phase: p2
    track: llm
    title: "RAG"
    weeks: [9, 14]
    budget_hours: 35
    prerequisites: [a1]
