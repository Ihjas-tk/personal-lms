      - id: b4-ragas-docs
        title: "Ragas metrics reference (context precision, context recall, faithfulness)"
        kind: doc
        url: https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/
        est_minutes: 180
      - id: b4-ragas-paper
        title: "Es et al., RAGAS: Automated Evaluation of Retrieval Augmented Generation"
        kind: paper
        url: https://arxiv.org/abs/2309.15217
        est_minutes: 90
        length: 6
        unit: pages
      - id: b4-ares-paper
        title: "Saad-Falcon et al., ARES: An Automated Evaluation Framework for RAG"
        kind: paper
        url: https://arxiv.org/abs/2311.09476
        est_minutes: 90
      - id: b4-evaluate-rag-skill
        title: "evals-skills: evaluate-rag"
        kind: repo
        url: https://github.com/ai-evals-course/evals-skills
        est_minutes: 120
      - id: b4-eugene-long-context
        title: "Eugene Yan, Evaluating Long-Context Question & Answer Systems"
        kind: doc
        url: https://eugeneyan.com/writing/
        est_minutes: 90
    checks:
      - id: b4-recall-ndcg
        module: b4
        type: numeric
        must_cover: true
        prompt: "Report recall@k and nDCG on a labelled retrieval set, computing both by hand on a small example before trusting a library."
        rubric:
          - "recall@k defined as the share of cases whose gold chunk appears in the top k, with k stated"
          - "nDCG computed as DCG/IDCG with the log2(i+1) discount, and the ideal ranking constructed explicitly"
          - "A worked hand calculation on at least one query is shown"
          - "The retrieval set is labelled (graded or binary relevance) and its size is stated"
          - "States why recall@k is the ceiling metric for a RAG system"
        reference: |
          One query, graded relevance, retrieved order `[2, 0, 3, 1, 0]` (gains `rel_i`):

          ```
          DCG@5  = Σ rel_i / log2(i + 1)
                 = 2/log2(2) + 0/log2(3) + 3/log2(4) + 1/log2(5) + 0/log2(6)
                 = 2/1.000 + 0 + 3/2.000 + 1/2.322 + 0
                 = 2.000 + 1.500 + 0.431 = 3.931

          ideal order [3, 2, 1, 0, 0]:
          IDCG@5 = 3/1.000 + 2/1.585 + 1/2.000 = 3.000 + 1.262 + 0.500 = 4.762

          nDCG@5 = 3.931 / 4.762 = 0.826
          ```

          ```python
          import numpy as np
          def ndcg_at_k(rels, k):
              rels = np.asarray(rels[:k], dtype=float)
              disc = 1 / np.log2(np.arange(2, len(rels) + 2))
              dcg = (rels * disc).sum()
              ideal = np.sort(rels)[::-1]
              idcg = (ideal * disc).sum()
              return dcg / idcg if idcg else 0.0
          ```

          Recall@k is the ceiling: if the passage is not retrieved, no generator can recover it, so
          report recall@k first and treat it as a hard bound on end-to-end quality.
        known_prior: true
        est_minutes: 30
        draft: true
      - id: b4-faithfulness-judge
        module: b4
        type: code
        must_cover: true
        prompt: "Ship a calibrated faithfulness judge for your RAG system and report its TPR and TNR."
        rubric:
          - "The judge decomposes the answer into claims and checks each against the retrieved context"
          - "It is calibrated against a held-out human-labelled set, with TPR and TNR reported, not accuracy"
          - "It replaces (not wraps) the generic Ragas faithfulness prompt, and the difference is shown on the same set"
          - "The criterion matches the domain's actual failure mode from the taxonomy, e.g. page-level support"
          - "The judge model differs from the system model, or the self-preference risk is measured"
        reference: |
          ```python
          FAITHFULNESS_V2 = """Decompose the ANSWER into atomic factual claims.
          For each claim, decide if it is entailed by the CITED PAGE text alone.
          Return JSON: {{"claims": [{{"claim": str, "supported": bool, "evidence": str}}],
                        "verdict": "PASS" | "FAIL"}}
          PASS only if every claim is supported."""

          def faithfulness(row):
              out = judge_model(FAITHFULNESS_V2, answer=row.answer, page=row.cited_page_text)
              return out["verdict"] == "PASS"

          # calibration, held-out split only, touched once per judge version
          tp = sum(faithfulness(r) and r.human == "PASS" for r in heldout)
          fn = sum(not faithfulness(r) and r.human == "PASS" for r in heldout)
          tn = sum(not faithfulness(r) and r.human == "FAIL" for r in heldout)
          fp = sum(faithfulness(r) and r.human == "FAIL" for r in heldout)
          print(f"TPR {tp/(tp+fn):.3f}  TNR {tn/(tn+fp):.3f}")
          ```

          Ragas's stock faithfulness prompt checks support against the whole retrieved context;
          our taxonomy says the product failure is *page-level* attribution, so the domain judge
          checks the cited page only. Run both on the same held-out set and show the TNR
          difference — that table is the argument for replacing the default.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b4-end-to-end-number
        module: b4
        type: numeric
        must_cover: true
        prompt: "Report an end-to-end answer-quality number for the RAG system with an interval, and explain why component metrics alone are not enough."
        rubric:
          - "One end-to-end number on the golden set, corrected for judge error and reported with a CI"
          - "Reported alongside the component numbers, not instead of them"
          - "Names the trap: component metrics improve while end-to-end does not, because the generator was never the bottleneck"
          - "States the config it was measured under (retriever, reranker, model, prompt version, golden-set tag)"
          - "Distinguishes this diagnostic set's rate from a production rate"
        reference: |
          ```
          golden-v1.2.0, retriever hybrid+contextual+rerank, claude-opus-5, prompt v7
          component : recall@5 0.88     nDCG@10 0.85
          component : faithfulness (calibrated judge) raw 0.86
          end-to-end: corrected pass rate 0.81, 95% CI [0.74, 0.87]   (n = 180)
          ```

          The end-to-end number is the only one that answers "is the user better off", and it is
          always lower than the components suggest, because a case must clear every stage. The
          trap the component numbers set is the reverse: retrieval improves from 0.72 to 0.88 and
          end-to-end does not move, because the generator was never the bottleneck — that
          non-movement is the finding, and it is invisible if you only report retrieval. Always
          pin the config: a pass rate without the retriever config, model, prompt version and
          golden-set tag is not reproducible. And note explicitly that this set is stratified for
          diagnosis, so 0.81 is not an estimate of production quality.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: b4-segment-breakdown
        module: b4
        type: judge
        must_cover: true
        prompt: "Produce a segment-level breakdown of the RAG eval identifying which query segment drags the average down, and say what you would fix first."
        rubric:
          - "Segments are defined by a stated scheme (topic, capability, answer type, document era), not post hoc"
          - "Per-segment n, pass rate and interval reported; segments with tiny n are flagged rather than ranked"
          - "The worst segment is identified by expected gain (share of traffic x gap), not by lowest score alone"
          - "A specific intervention is proposed for that segment, at the right layer (retrieval vs generation)"
          - "Multiple comparisons acknowledged when ranking many segments"
        reference: |
          | segment | n | pass | 95% CI | share of traffic | expected gain if fixed to 0.85 |
          |---|---|---|---|---|---|
          | single-fact lookup | 80 | 0.91 | [0.83, 0.96] | 55% | - |
          | multi-hop | 40 | 0.62 | [0.47, 0.76] | 15% | +3.5 pts |
          | comparison across wells | 35 | 0.54 | [0.38, 0.70] | 25% | +7.8 pts |
          | unanswerable | 25 | 0.80 | [0.61, 0.92] | 5% | +0.3 pts |

          The lowest score is "comparison", but the decision rule is expected gain = traffic share
          x (target - current): comparison at 25% of traffic and a 0.31 gap is worth 7.8 points of
          overall quality, nearly twice multi-hop. Diagnose before fixing: comparison queries fail
          at retrieval (one well's chunk crowds out the other's), so the fix is per-entity
          retrieval with a fixed budget per well, not a better prompt. With four segments ranked,
          say whether you corrected for multiple comparisons or chose not to.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b4-leading-vs-lagging
        module: b4
        type: explain
        must_cover: false
        prompt: "Distinguish leading from lagging metrics in a RAG system and give two of each from your own project."
        rubric:
          - "Lagging: outcome metrics that confirm value but move slowly and cannot be acted on directly"
          - "Leading: component metrics you can move this week that are believed to cause the lagging ones"
          - "Two concrete examples of each from the learner's system"
          - "States the causal assumption linking them, and that it must itself be checked"
          - "Names the failure of leading-only measurement: optimising a leading metric that does not move the lagging one"
        reference: |
          Lagging metrics are outcomes: end-to-end corrected pass rate, user-reported trust,
          escalation rate to a human, time-to-answer for a real engineer. They are what you care
          about and they move slowly, in aggregate, and only after a change ships. Leading metrics
          are the components you can move in a week and which you believe cause them: recall@5,
          nDCG@10, citation-resolution rate, abstention rate on unanswerable questions. The link
          between the two is a causal assumption, not a fact — "raising recall@5 will raise the
          pass rate" is a hypothesis, and it is exactly the hypothesis that fails when retrieval
          improves and end-to-end does not. So the discipline is to track leading metrics weekly
          because they are actionable, and to check them against the lagging metric every time a
          change ships, discarding the leading metric if the link breaks.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b4-ragas-replace-judges
        module: b4
        type: explain
        must_cover: false
        prompt: "Explain what Ragas gives you in week one and what you must replace before the numbers are quotable."
        rubric:
          - "Names context precision, context recall and faithfulness as the three core metrics and what each measures"
          - "Credits Ragas as a fast baseline that gets a number on the board in an afternoon"
          - "States the limitation: its judge prompts are generic and untuned to the domain taxonomy"
          - "States the replacement: your calibrated judges, with TPR/TNR, while keeping the harness shape"
          - "Warns against the anti-pattern of a Ragas wrapper with default metrics and no calibration"
        reference: |
          Ragas decomposes cleanly into three things: context precision (are the retrieved chunks
          useful?), context recall (did we get all the needed ones?), and faithfulness (is the
          answer grounded in what we retrieved?); everything else in its metric list is a
          derivative. As a week-one baseline it is genuinely useful — it gets a number on the board
          in an afternoon and tells you roughly where the system stands. What is not quotable is
          the number itself, because its judges ship generic prompts that were never tuned to your
          failure taxonomy and whose TPR/TNR against your domain you have not measured. So keep
          the shape and replace the graders: same metric names, your calibrated judges underneath,
          with their confusion matrices published. The named anti-pattern in the field is exactly
          the other thing: a Ragas wrapper with default metrics and no calibration, reported as
          evidence.
        known_prior: false
        est_minutes: 20
        draft: true

  - id: b6
    area: evals-prod
    phase: p3
    track: evals
