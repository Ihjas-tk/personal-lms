        url: https://hamel.dev/blog/posts/evals-faq/
        est_minutes: 240
      - id: b2-generate-synthetic-data-skill
        title: "evals-skills: generate-synthetic-data and build-review-interface"
        kind: repo
        url: https://github.com/ai-evals-course/evals-skills
        est_minutes: 180
      - id: b2-jxnl-synthetic-rag
        title: "Jason Liu, Systematically Improving Your RAG (synthetic eval data)"
        kind: doc
        url: https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/
        est_minutes: 120
      - id: b2-anthropic-roadmap
        title: "Anthropic, Demystifying evals for AI agents (8-step roadmap, steps 3-4)"
        kind: doc
        url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
        est_minutes: 120
      - id: b2-aligneval
        title: "Eugene Yan, AlignEval: Building an App to Make Evals Easy, Fun, and Automated"
        kind: doc
        url: https://eugeneyan.com/writing/aligneval/
        est_minutes: 90
      - id: b2-llm-judge-steps-1-4
        title: "Hamel Husain, Creating a LLM-as-a-Judge, steps 1-4 (labelling workflow)"
        kind: doc
        url: https://hamel.dev/blog/posts/llm-judge/
        est_minutes: 120
    checks:
      - id: b2-golden-set-versioned
        module: b2
        type: code
        must_cover: true
        prompt: "Ship a versioned golden dataset of at least 100 examples with stable case ids and a data card."
        rubric:
          - "JSONL or similar with deterministic case ids that never change once assigned"
          - "Each record carries input, target/label, provenance (real trace id or synthetic recipe), and the rubric version it was labelled under"
          - "The set is versioned in git with a tag or version field, and the version is recorded on every eval run"
          - "A data card states size, source, date, licence and known gaps"
          - "Adding examples appends; it never renumbers or mutates existing ids"
        reference: |
          ```jsonl
          {"id":"gs-0001","split":"dev","input":{"question":"What was the TD of 6506/3-1?"},
           "target":{"answer_contains":"3,155","page":214},
           "provenance":{"kind":"derived","source":"sodir_wellbore_table"},
           "rubric_version":3,"labelled_by":"pde","labelled_at":"2026-11-04"}
          {"id":"gs-0002","split":"heldout","input":{"question":"Which contractor ran the 12 1/4 in section?"},
           "target":{"answer_contains":"Odfjell"},
           "provenance":{"kind":"human_written"},"rubric_version":3,"labelled_by":"pde"}
          ```

          Plus `DATACARD.md`: what this set is for, n per split, real/synthetic split, how cases
          were sampled, the annotation guideline and its version history, licence of the source
          documents (NLOD for Sodir), and the known gaps ("no multi-well comparison questions;
          no Norwegian-language queries"). Tag the release (`golden-v1.2.0`) and record that tag
          in every run's results row, so a pass-rate change can always be attributed to code or to
          data, never ambiguously to both.
        known_prior: false
        est_minutes: 35
        draft: true
      - id: b2-sampling-rationale
        module: b2
        type: explain
        must_cover: true
        prompt: "Document the sampling rationale for your golden set: what the input distribution is, how you covered it, and what you deliberately over-sampled."
        rubric:
          - "Names the dimensions of the input space (query type, document era, answer type, difficulty) explicitly"
          - "States the sampling scheme: stratified by those dimensions, not uniform random"
          - "States the deliberate over-sampling of failure-prone segments and why that is not cheating"
          - "Says what is under-represented and therefore what the set cannot tell you"
          - "Connects the rationale to the taxonomy from error analysis"
        reference: |
          Write it as three paragraphs. The input space first: for the report-QA system the
          dimensions are query type (single-fact lookup, multi-hop, comparison, unanswerable),
          document era (pre-2000 scanned vs modern digital), answer type (date, depth, name,
          narrative) and difficulty. Then the scheme: stratified sampling across those cells
          rather than uniform random over production traffic, because uniform random at a 7%
          failure rate spends most of the annotation budget confirming passes; the target is
          roughly 50:50 pass/fail spanning the distribution. Then the honesty clause: over-sampling
          failure-prone segments is deliberate and makes the set a *diagnostic* instrument, which
          means its raw pass rate is not an estimate of production quality — production rates come
          from sampled traffic, and the two must never be conflated. Finally, state the gaps, and
          tie each stratum back to a failure mode from the taxonomy.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: b2-synthetic-real-split
        module: b2
        type: explain
        must_cover: true
        prompt: "State the synthetic-versus-real split of your golden set and defend the proportion, including how the synthetic cases were grounded in real constraints."
        rubric:
          - "The split is stated as counts, and recorded per record so results can be broken down by provenance"
          - "Synthetic generation is dimension-based (features x scenarios x personas), not free-form 'make me questions'"
          - "Grounding is evidenced: generated from real chunks, real schema, real user vocabulary"
          - "States the risk of synthetic-only sets: they encode the developer's imagination, not the users' behaviour"
          - "Reports pass rates separately for real and synthetic to show the two are not wildly different"
        reference: |
          A defensible split for a pre-launch system is roughly 60% synthetic / 40% real, moving
          toward real as traffic accumulates. Synthetic cases are generated by dimension-based
          tuple expansion: enumerate features (fact lookup, multi-hop, unanswerable), scenarios
          (scanned 1980s report, modern digital report, missing section), and personas (drilling
          engineer, geologist, procurement), take the cross-product, sample cells, and generate one
          case per cell *from a real passage or a real table row* so the target is known by
          construction. The failure mode of synthetic-only sets is that they encode what you
          imagined users would ask; the guard is to keep a real slice and to report pass rates
          separately by provenance — if the system scores 0.85 on synthetic and 0.55 on real, the
          synthetic generator is the thing that needs fixing, not the system.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b2-annotation-guideline
        module: b2
        type: explain
        must_cover: true
        prompt: "Write the annotation guideline for your golden set: the binary criterion, the edge cases, and the worked examples."
        rubric:
          - "One binary criterion stated in a single sentence, with the pass condition unambiguous"
          - "At least three edge cases resolved explicitly, each with the ruling and the reason"
          - "Worked positive and negative examples, taken from real traces"
          - "A version number and a changelog, because the definition will drift"
          - "An instruction to write a free-text critique alongside every fail"
        reference: |
          **Criterion (v3).** PASS if every factual claim in the answer is supported by the cited
          page of the cited report, and the answer does not omit a qualifier present in the source.
          Otherwise FAIL.

          **Edge cases.**
          1. Answer is correct but cites the wrong page -> FAIL (page-level citation is the
             product promise).
          2. Answer says "the report does not state this" and the report indeed does not -> PASS
             (abstention is a correct behaviour, tracked separately as abstention rate).
          3. Answer is correct and adds a true fact not in the cited page and not cited -> FAIL
             (uncited claims are the failure mode we are measuring).
          4. Source itself is internally inconsistent -> PASS if the answer reports the
             inconsistency; FAIL if it silently picks one.

          **Examples.** t-0412 (fail, wrong page), t-0137 (pass, correct abstention).

          **Always** write one sentence of critique on a FAIL. Changelog: v2 -> v3 added edge
          case 4 after 18 traces hit it.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b2-agreement-figure
        module: b2
        type: numeric
        must_cover: true
        prompt: "If more than one annotator labelled any part of the set, compute Cohen's kappa (or Krippendorff's alpha) and say what you did about the value you got."
        rubric:
          - "The right statistic for the design: kappa for two raters on complete data, alpha for n raters or missing data"
          - "Observed and expected agreement both reported, not only the kappa"
          - "Interpretation given against a stated threshold, with kappa < 0.4 read as a broken rubric"
          - "The action taken is stated: fix the rubric and re-label, not average the disagreement away"
          - "If a single Principal Domain Expert labelled everything, that is stated as a deliberate consistency-over-coverage trade, with no kappa fabricated"
        reference: |
          Two raters, 100 items, binary:

          ```
                       B pass   B fail
          A pass          52       8
          A fail          11      29

          p_o = (52 + 29) / 100 = 0.81
          p_e = (0.60 × 0.63) + (0.40 × 0.37) = 0.378 + 0.148 = 0.526
          kappa = (p_o - p_e) / (1 - p_e) = (0.81 - 0.526) / 0.474 = 0.599
          ```

          ```python
          from sklearn.metrics import cohen_kappa_score
          cohen_kappa_score(a_labels, b_labels)   # 0.599
          ```

          0.60 is moderate-to-substantial: usable, but the 19 disagreements are the most
          informative rows in the set — read them, and they will name the under-specified clause.
          Below about 0.4 the rubric is broken: fix the guideline, bump its version, and re-label,
          rather than averaging or majority-voting the disagreement away. If one Principal Domain
          Expert labelled everything, say so and report no kappa — that is a deliberate trade of
          coverage for consistency, not an omission.
        known_prior: true
        est_minutes: 25
        draft: true
      - id: b2-heldout-slice
        module: b2
        type: judge
        must_cover: true
        prompt: "Show the held-out judge test slice and demonstrate the discipline that kept you from looking at it."
        rubric:
          - "The held-out slice is separated at creation time, roughly 100 labelled examples, and marked in the data"
          - "A mechanism, not a promise: separate file, separate loader, a flag the judge-iteration notebook cannot set"
          - "A log of how many times it has been evaluated, with the judge version each time"
          - "States the rule: touch it once per judge version, and report the number that came out even if it is worse"
          - "Explains what is lost if it leaks: TPR/TNR become optimistic and the Rogan-Gladen correction inherits the bias"
        reference: |
          The slice is created when the labels are, not afterwards: split the human-labelled pool
          into `dev` (~100, used freely while iterating the judge prompt) and `heldout` (~100,
          written to a separate file that the iteration notebook does not import). The discipline
          has to be mechanical — a loader that refuses `split="heldout"` unless an explicit
          `--final` flag is passed, and an append-only log recording each evaluation:

          ```
          judge-v1  2026-11-21  TPR 0.81  TNR 0.93
          judge-v2  2026-12-02  TPR 0.88  TNR 0.91
          ```

          One touch per judge version, and you report what came out even when v2 is worse than v1.
          If the held-out set leaks into iteration, TPR and TNR are optimistic, and because those
          two numbers feed the Rogan-Gladen correction, every corrected pass rate and every
          interval built on them inherits the bias — the whole calibration story stops being
          evidence.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b2-dimension-tuples
        module: b2
        type: code
        must_cover: false
        prompt: "Implement dimension-based synthetic generation: enumerate the tuple space, sample cells, and generate one grounded case per cell."
        rubric:
          - "Dimensions declared as explicit lists, and the cross-product taken in code"
          - "Cells are sampled with a seed so the set is reproducible"
          - "Each generated case is grounded in a real artefact (a chunk, a table row) so the target is known"
          - "Generated cases carry their recipe (which cell produced them) in provenance"
          - "A manual review step is built in before cases enter the golden set"
        reference: |
          ```python
          import itertools, random

          FEATURES  = ["fact_lookup", "multi_hop", "comparison", "unanswerable"]
          SCENARIOS = ["scanned_1980s", "modern_digital", "missing_section"]
          PERSONAS  = ["drilling_engineer", "geologist", "procurement"]

          cells = list(itertools.product(FEATURES, SCENARIOS, PERSONAS))   # 36 cells
          rng = random.Random(20260922)
          plan = [(c, n) for c in cells for n in range(4)]                 # 144 target cases

          def generate(cell, chunk):
              feature, scenario, persona = cell
              q = llm(PROMPT.format(feature=feature, persona=persona, passage=chunk.text))
              return {
                  "input": {"question": q},
                  "target": None if feature == "unanswerable" else {"gold_chunk_ids": [chunk.id]},
                  "provenance": {"kind": "synthetic", "cell": cell, "seed": 20260922,
                                 "grounded_in": chunk.id},
                  "status": "needs_review",          # nothing enters the golden set unreviewed
              }
          ```

          Every case is grounded in a real chunk, so the target is known by construction, and every
          case records the cell that produced it, so coverage is auditable.
        known_prior: false
        est_minutes: 30
        draft: true

  - id: b3
    area: evals-found
    phase: p2
    track: evals
