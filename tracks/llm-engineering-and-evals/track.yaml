  - {id: adapt-serve, title: Adapt & serve, scope: a3 · a4}
  - {id: context-rag, title: Context & retrieval, scope: a5 · a6}
  - {id: agents-prod, title: Agents & production, scope: a7 · a8}
  - {id: evals-found, title: Evals foundation, scope: b0 · b1 · b2 · b3}
  - {id: evals-prod, title: Evals in production, scope: b4 · b5 · b6 · b7 · b8 · b9 · writeup}
phases:
  - id: p0
    title: "Orient & set up"
    weeks: [1, 2]
    modules: [p0-orient]
  - id: p1
    title: "Transformers from scratch"
    weeks: [3, 8]
    modules: [a1]
  - id: p2
    title: "v0 app + evals foundation"
    weeks: [9, 14]
    modules: [b0, b1, b2, b3, a5, a6]
    order_note: 'Do them in this order: error analysis before judges, judges before the harness.'
  - id: p3
    title: "RAG depth + RAG evals"
    weeks: [15, 18]
    modules: [b4, b6]
    order_note: 'Measure the RAG before you gate it: b4 before b6.'
  - id: p4
    title: "Agents + agent evals"
    weeks: [19, 25]
    modules: [a7, b5]
    order_note: Build the agent first; the agent evals need a running agent to score.
  - id: p5
    title: "Production, safety, stats"
    weeks: [26, 30]
    modules: [a8, b7, b8, b9]
  - id: p6
    title: "Post-training & inference"
    weeks: [31, 36]
    modules: [a2, a3, a4]
  - id: p7
    title: "Write-up & publish"
    weeks: [37, 40]
    modules: [cap-writeup]

