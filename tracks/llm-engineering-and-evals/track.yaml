        est_minutes: 300
    checks:
      - id: a2-arch-diff
        module: a2
        type: explain
        must_cover: true
        prompt: "Draw the architecture diff between GPT-2 and a 2026 open model and justify each change in one sentence."
        rubric:
          - "Positional encoding: learned absolute to RoPE, justified by relative encoding and length generalisation"
          - "Normalisation: post-norm LayerNorm to pre-norm RMSNorm, justified by training stability and one fewer statistic"
          - "MLP: GELU to SwiGLU (gated), justified by better quality per parameter at the same FLOPs"
          - "Attention: MHA to GQA/MQA, justified by KV-cache size at inference"
          - "Also names: bias terms removed, MoE layers in some models, larger vocab, longer context; each with a one-line reason"
        reference: |
          | GPT-2 (2019) | 2026 open model | why |
          |---|---|---|
          | learned absolute position embeddings | RoPE | relative by construction, defined at any index, composes with KV caching |
          | post-norm LayerNorm | pre-norm RMSNorm | pre-norm trains stably at depth without warmup tricks; RMSNorm drops the mean statistic for the same quality |
          | GELU MLP, 4x | SwiGLU, ~8/3x with gating | better loss per FLOP; the gate lets the MLP modulate its own input |
          | multi-head attention | grouped-query attention | shrinks the KV cache by the group factor, which is what bounds inference batch size |
          | bias terms in linears | no biases | no measurable quality loss, fewer params, slightly better stability |
          | dense FFN everywhere | MoE layers in some models | more parameters at constant active FLOPs |
          | 50k BPE vocab, 1k context | 100k-200k vocab, 128k+ context | better multilingual and code compression; long-document use cases |

          The through-line: almost every change is bought with inference cost or training stability
          in mind, not raw training loss.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: a2-router-collapse
        module: a2
        type: explain
        must_cover: true
        prompt: "Explain what router collapse looks like in an MoE and what auxiliary loss prevents it."
        rubric:
          - "Describes the failure: the router sends nearly all tokens to a few experts, the rest receive no gradient and stay untrained"
          - "Names the feedback loop: well-trained experts attract more tokens, which trains them further"
          - "States the symptom you would observe: expert-utilisation histogram highly skewed, and a capacity-factor drop rate"
          - "Names the load-balancing auxiliary loss and its form: the product of mean routing probability and mean token fraction per expert, summed and scaled"
          - "Mentions at least one alternative or complement: router z-loss, noisy top-k gating, or expert-choice routing"
        reference: |
          Router collapse is the degenerate equilibrium where the gating network routes almost all
          tokens to a handful of experts. It is self-reinforcing: an expert that receives more
          tokens trains faster, becomes more useful, and so attracts more tokens, while starved
          experts never receive gradient and remain at initialisation. You see it in the
          expert-utilisation histogram — a few experts at many times the mean and a long tail at
          near zero — and in the fraction of tokens dropped once experts exceed their capacity
          factor. The standard prevention is a load-balancing auxiliary loss, added to the training
          objective: for each expert, multiply the fraction of tokens routed to it by the mean
          router probability assigned to it, sum over experts, scale by the expert count and a
          small coefficient. It penalises the concentration directly. Complements include a router
          z-loss to keep logits from exploding, noisy top-k gating during early training, and
          expert-choice routing, where experts select tokens and balance is exact by construction.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a2-dpo-grpo-sft
        module: a2
        type: explain
        must_cover: true
        prompt: "Say without hedging when you would reach for DPO vs GRPO vs plain SFT, and what data each requires."
        rubric:
          - "SFT: demonstrations of the desired output; use when you can write or collect the right answer"
          - "DPO: pairs of preferred and rejected responses for the same prompt; no reward model, no sampling loop"
          - "GRPO: a programmatic reward or verifier and online sampling of groups of completions per prompt"
          - "States the data cost and the compute cost of each, and that they are usually sequential, not alternatives"
          - "Names the decision rule: can you demonstrate it, rank it, or check it?"
        reference: |
          The question that decides it is: for this behaviour, can I *demonstrate* the right
          answer, only *rank* answers, or *check* an answer automatically?

          **SFT** when you can demonstrate. Data: prompt/response demonstrations, a few hundred to
          a few tens of thousands; 500 clean examples beat 5,000 noisy ones. Cheapest, always
          first, and it sets format and style.

          **DPO** when you can only rank. Data: (prompt, chosen, rejected) triples, typically
          10k-100k, and they must come from a policy close to the one you are training or the
          gradient is off-distribution. No reward model and no sampling loop, so it is nearly as
          cheap as SFT — this is the whole point of DPO.

          **GRPO** when you can check. Data: prompts plus a programmatic verifier (unit tests, an
          exact-match checker, a schema). It samples a group of completions per prompt at training
          time and uses the group's relative rewards as the advantage, so it costs several times
          SFT in compute, and it is what produces reasoning behaviour rather than merely style.

          In practice they are sequential — SFT, then a preference or RL stage — not alternatives.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a2-nanochat-rl
        module: a2
        type: code
        must_cover: true
        prompt: "Run nanochat's RL stage and describe what changed in the model's behaviour and why."
        rubric:
          - "The RL stage actually run, with the reward signal and the task named"
          - "Before/after generations on the same prompts shown side by side"
          - "The change described concretely: length, format adherence, self-checking, or accuracy on the verifiable task"
          - "The mechanism named: the reward rewarded the behaviour, and the group-relative advantage pushed toward it"
          - "At least one undesirable change noted (verbosity, reward hacking, or loss of diversity)"
        reference: |
          ```bash
          # after the pretrain and SFT stages of the speedrun
          python -m scripts.chat_rl        # GRPO on the verifiable task
          python -m scripts.chat_eval --stage rl --compare sft
          ```

          What to report is the delta, not the score. A typical honest write-up: on the verifiable
          arithmetic task accuracy moved from 0.41 (SFT) to 0.58 (RL); generations got noticeably
          longer and started showing an explicit intermediate-step pattern before the final answer;
          the required answer format became almost perfectly consistent because the verifier only
          rewarded parseable answers. Mechanism: GRPO samples a group of completions per prompt and
          advantages each against the group mean, so behaviours that correlate with the verifier
          passing get reinforced — including ones nobody asked for. Note the costs too: responses
          to *non*-arithmetic prompts also got longer (the length habit generalised), and output
          diversity fell, which is the classic RL-tax on a small model.
        known_prior: false
        est_minutes: 40
        draft: true
      - id: a2-reasoning-inference
        module: a2
        type: explain
        must_cover: true
        prompt: "Explain what a reasoning model is doing at inference time that a base instruct model is not, and what it costs in tokens."
        rubric:
          - "Names the mechanism: it generates a long internal chain before the answer, trained by RL on verifiable rewards rather than prompted"
          - "Distinguishes it from chain-of-thought prompting: the behaviour is in the weights, and the thinking tokens are often not shown"
          - "States the scaling knob: more thinking tokens buys accuracy on hard tasks with diminishing returns"
          - "Quantifies the cost in tokens and dollars with an example"
          - "States when it is the wrong choice: latency-bound, simple, or unverifiable tasks"
        reference: |
          A reasoning model spends generation-time compute before answering: it emits a long
          internal chain — exploring, checking, backtracking — and only then the response. The
          difference from chain-of-thought prompting is that the behaviour was trained in by RL on
          verifiable rewards rather than requested in the prompt, and the chain is often hidden
          from the caller while still being billed. The knob is the thinking budget: on genuinely
          hard problems accuracy rises with thinking tokens and then flattens; on easy ones it
          flattens immediately. The cost is real. A 4,000-token chain at $15/M output tokens adds
          $0.06 per request — $60 per 1,000 — on top of the visible answer, and it adds seconds of
          latency. So it is the wrong tool for latency-bound interactive features, for tasks a
          small model already gets right, and for tasks with no verifiable structure, where the
          extra tokens buy confident elaboration rather than correctness.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: a2-gqa-kv-savings
        module: a2
        type: numeric
        must_cover: false
        prompt: "Compute the KV-cache saving from grouped-query attention for a given configuration, and state what that buys."
        rubric:
          - "KV cache size formula stated: 2 * n_layer * n_kv_heads * d_head * seq_len * batch * bytes_per_element"
          - "MHA and GQA computed for the same model, with the group factor stated"
          - "The saving expressed as a ratio, equal to n_heads / n_kv_heads"
          - "Translates the saving into a concrete serving consequence: larger batch or longer context on the same GPU"
          - "Notes the quality cost is small but not zero, and that MQA is the extreme case"
        reference: |
          ```
          KV bytes = 2 (K and V) × n_layer × n_kv_heads × d_head × seq_len × batch × bytes
          ```

          Model: `n_layer = 32`, `n_heads = 32`, `d_head = 128`, bf16 (2 bytes),
          `seq_len = 8192`, `batch = 32`.

          ```
          MHA  (n_kv_heads = 32):
            2 × 32 × 32 × 128 × 8192 × 32 × 2 = 137.4 GB
          GQA  (n_kv_heads = 8, group factor 4):
            2 × 32 ×  8 × 128 × 8192 × 32 × 2 =  34.4 GB
          saving = 32/8 = 4x
          ```

          137 GB of KV does not fit alongside weights on a single 80 GB H100 at all; 34 GB does.
          So the saving is not an efficiency nicety — it is the difference between serving batch 32
          at 8k context on one GPU and not serving it. The quality cost of sharing KV heads is
          small but non-zero, and MQA (`n_kv_heads = 1`) is the extreme point where the cost starts
          to show.
        known_prior: false
        est_minutes: 25
        draft: true
      - id: a2-long-context-yarn
        module: a2
        type: explain
        must_cover: false
        prompt: "Explain how a model trained at 4k context is extended to 128k: what YaRN changes, what training is still required, and what degrades."
        rubric:
          - "Names the base problem: RoPE phases beyond the trained range are off-distribution"
          - "Position interpolation as the naive fix and its cost to local precision"
          - "YaRN / NTK-aware scaling: per-frequency treatment, plus attention temperature scaling"
          - "States that a short fine-tuning stage on long sequences is still needed, not zero-shot"
          - "Names what degrades: needle-in-a-haystack recall in the middle, and the quadratic attention and KV-cache cost"
        reference: |
          The obstacle is that RoPE's slow-rotating dimensions reach phase angles beyond 4k that
          the model never saw, so attention scores are evaluated off-distribution. Position
          interpolation squeezes all indices back inside the trained range by a uniform factor;
          that works but blurs the fast-rotating dimensions that encoded local order, costing
          short-range precision. YaRN applies NTK-aware scaling instead: high-frequency dimensions
          are left alone, low-frequency ones are interpolated, mid-band ones are ramped between,
          and an attention temperature correction compensates for the entropy change as sequences
          grow. That is not free: a short continued-pretraining stage on genuinely long documents
          is still required, typically a fraction of a percent of the original token budget. What
          degrades anyway is retrieval from the middle of the window, and the cost side is
          unavoidable — attention work grows with sequence length and the KV cache grows linearly,
          which is what actually caps deployed context.
        known_prior: false
        est_minutes: 25
        draft: true

