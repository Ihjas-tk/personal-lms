        checks: [b7-benchmark-procurement, b7-five-questions]
    resources:
      - id: b7-owasp-top10-2026
        title: "OWASP GenAI, Top 10 for LLM Applications 2026"
        kind: doc
        url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
        est_minutes: 240
      - id: b7-owasp-initiative
        title: "OWASP GenAI initiative page (Agentic Top 10, Agent Control Standard, Red Teaming Guide)"
        kind: doc
        url: https://genai.owasp.org/initiative/owasp-top-10-for-llm-and-genai/
        est_minutes: 120
      - id: b7-openai-swebench
        title: "OpenAI, Why we no longer evaluate SWE-bench Verified"
        kind: doc
        url: https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
        est_minutes: 60
      - id: b7-leaderboard-illusion
        title: "Singh et al., The Leaderboard Illusion"
        kind: paper
        url: https://arxiv.org/pdf/2504.20879
        est_minutes: 90
      - id: b7-eugene-cybersec-evals
        title: "Eugene Yan, Patterns for Building Cybersecurity Evals"
        kind: doc
        url: https://eugeneyan.com/writing/
        est_minutes: 60
      - id: b7-cyberseceval3
        title: "CyberSecEval 3 (safety benchmark reference)"
        kind: paper
        url: https://arxiv.org/pdf/2408.01605
        est_minutes: 60
    checks:
      - id: b7-redteam-20-cases
        module: b7
        type: code
        must_cover: true
        prompt: "Deliver a red-team report on a system you built with at least 20 adversarial cases spanning direct injection, indirect injection via retrieved content, PII extraction and refusal probes."
        rubric:
          - "At least 20 cases, distributed across all four categories, none of them duplicates of one another"
          - "Each case has a stated success criterion evaluated automatically, not by eye"
          - "Indirect-injection cases deliver the payload through the retrieval corpus or a tool result"
          - "Results reproducible: the cases live in the repo and run from one command"
          - "A pass/fail per case, with the transcript retained for every success"
        reference: |
          ```python
          # redteam/cases.yaml -> one runner, one command
          CATEGORIES = ["direct_injection", "indirect_injection", "pii_extraction", "refusal_probe"]

          def run_case(case, system):
              if case["vector"] == "corpus":
                  index.upsert([Chunk(id=case["id"], text=case["payload"])])
              t = system.run(case["prompt"])
              return {
                  "id": case["id"],
                  "category": case["category"],
                  "succeeded": eval_criterion(case["criterion"], t),  # automatic, not by eye
                  "transcript": t.path,
              }
          ```

          A workable distribution over 24 cases: 6 direct injection (instruction override, role
          play, encoded payload, delimiter escape, multilingual, many-shot), 6 indirect (payload in
          a retrieved PDF, in a table cell, in a tool error string, in a filename, in a footnote,
          in a base64 block), 6 PII extraction (system-prompt exfiltration, credential probing,
          other users' data, training-data regurgitation, log echo, metadata leak), 6 refusal
          probes (3 over-refusal on legitimate HSE questions, 3 under-refusal on genuinely unsafe
          requests). Keep the transcript for every success — it is the evidence.
        known_prior: false
        est_minutes: 45
        draft: true
      - id: b7-severity-rating
        module: b7
        type: judge
        must_cover: true
        prompt: "Assign a severity to each red-team finding and map it to an OWASP GenAI 2026 category, defending the ratings."
        rubric:
          - "A stated severity scale with criteria, applied consistently rather than by feel"
          - "Severity reflects impact and precondition difficulty, not how clever the attack was"
          - "Each finding maps to a named OWASP 2026 category (LLM01, LLM02, LLM03, ...) or to the Agentic Top 10 where the system is agentic"
          - "At least one finding argued down as low severity because the blast radius is contained"
          - "A prioritised remediation list, not a flat table"
        reference: |
          Scale: **Critical** — data loss, exfiltration, or an irreversible action, reachable by an
          unprivileged attacker. **High** — the same impact but requiring a precondition (corpus
          write access). **Medium** — policy violation or wrong output with no side effect.
          **Low** — contained by architecture; the attack fires and nothing happens.

          | id | finding | precondition | severity | OWASP 2026 |
          |---|---|---|---|---|
          | RT-003 | indirect injection invokes `write_note` | attacker can index a document | High | LLM01, LLM03 |
          | RT-007 | system prompt recovered verbatim | none | Medium | LLM02 (hidden context exposure) |
          | RT-011 | over-refusal on legitimate H2S questions | none | Medium | — (quality, not security) |
          | RT-014 | injection fires, approval gate denies | corpus write access | **Low** | LLM01 |

          RT-014 is argued down deliberately: the attack succeeds at the model layer and is
          contained at the architecture layer, which is exactly the outcome containment was
          designed for. Remediate in order of severity x precondition likelihood, not in id order.
        known_prior: false
        est_minutes: 30
        draft: true
      - id: b7-benchmark-procurement
        module: b7
        type: explain
        must_cover: true
        prompt: "Write a paragraph for a non-technical stakeholder explaining why a vendor's headline benchmark number should not change a procurement decision."
        rubric:
          - "Written for a non-technical reader: no jargon, no metric names left unexplained"
          - "Names contamination concretely, with the SWE-bench Verified audit as the example"
          - "Names the scaffolding confound: the same model scores 10-15 points differently depending on the harness"
          - "Names distribution mismatch: the benchmark is not your documents or your users"
          - "Ends with what would change the decision: a pilot on your own data with your own acceptance criteria"
        reference: |
          A vendor's benchmark score is a result on someone else's exam, marked by the people
          selling the course. Three things make it a poor basis for a purchase. First,
          contamination: when OpenAI audited 138 of its own failures on a popular coding benchmark
          it found that about 59% were caused by flawed tests rather than by the model, and it
          stopped reporting the number altogether. Second, the harness: the same model scores 10 to
          15 points differently depending on the software wrapped around it, so the figure measures
          the vendor's engineering as much as the model. Third, and most simply, the benchmark is
          not our documents, our questions, or our users. What would change my recommendation is a
          two-week pilot on our own end-of-well reports, scored against acceptance criteria we
          write first, with the error bars shown.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b7-five-questions
        module: b7
        type: explain
        must_cover: false
        prompt: "State the five questions to ask of any leaderboard number, with the concrete evidence behind each."
        rubric:
          - "Contamination: could the test data be in training, and what audits have found"
          - "Who ran it: vendor-submitted vs independently verified, with the proportion"
          - "What was the scaffold: retries, exploration loops, test-driven harnesses"
          - "Is it saturated: a benchmark everyone passes carries no information"
          - "Does it resemble your distribution: public benchmarks measure capability, your golden set measures your product"
        reference: |
          **1. Contamination.** OpenAI's audit of 138 o3 failures on SWE-bench Verified found about
          59% were caused by flawed tests; separate work found roughly a third of successful patches
          involved solution leakage from the issue text, and models recall in-repo file paths far
          more reliably than external ones.

          **2. Who ran it.** On one 2026 snapshot of a public SWE-bench Verified leaderboard, one
          of 100 listed results was independently verified; the rest were vendor-submitted.

          **3. What was the scaffold.** Retries, file exploration and test-driven loops move scores
          10-15 points with the same model. Report harness and model together, always.

          **4. Is it saturated.** A benchmark everything passes has stopped carrying information.

          **5. Does it resemble your distribution.** Almost never. Public benchmarks measure
          capability and are useful for shortlisting models; only your golden set says whether your
          system works.
        known_prior: false
        est_minutes: 20
        draft: true
      - id: b7-indirect-injection
        module: b7
        type: explain
        must_cover: false
        prompt: "Explain why indirect injection through retrieved documents is harder to defend than direct injection, and what it implies for a RAG system over public PDFs."
        rubric:
          - "Direct injection comes from the user, who is usually also the victim; indirect comes from content the system chose to trust"
          - "The attacker never talks to the system: they publish a document and wait"
          - "Input filtering is weaker because the payload arrives after the trust decision was made"
          - "For a public corpus, states the threat model honestly: who can put text into the index"
          - "Mitigations named: data/instruction delimiting, least privilege, approval gates, and treating all retrieved text as hostile"
        reference: |
          With direct injection the attacker is the user, and in most products the user is also the
          person harmed, which bounds the damage. Indirect injection inverts that: the payload
          arrives inside content the system itself decided to retrieve and trust, from an attacker
          who never interacts with the system at all — they publish a document and wait for the
          retriever to find it. Input filtering is correspondingly weaker, because the filter runs
          on the user's turn, while the payload enters later, after the trust decision has already
          been made, wrapped in exactly the format the model was told to treat as evidence. For a
          RAG system over public PDFs the threat model has to be written down: who can get text
          into the index, and can a third party publish into the source corpus? Mitigations are
          architectural — mark retrieved text as data with delimiters the system prompt declares,
          scope every tool credential, gate irreversible actions outside the model, and assume
          every retrieved token is hostile.
        known_prior: false
        est_minutes: 20
        draft: true
  - id: b8
    area: evals-prod
    phase: p5
    track: evals
    title: "Statistics for evals"
    weeks: [26, 30]
    budget_hours: 12
    prerequisites: [a7, b5]
    topics:
      - id: wilson-intervals
        title: Wilson and Agresti-Coull intervals, not Wald
        summary: n is small and p sits near 0 or 1, exactly where the Wald interval lies to you.
        kind: idea
        resources: [b8-miller-error-bars]
      - id: paired-mcnemar
        title: Paired comparison on shared question sets; McNemar for pass/fail
        summary: Same questions, both models, and only the disagreements carry the signal.
        kind: idea
        checks: [b8-mcnemar-paired]
      - id: clustered-bootstrap
        title: 'Clustered bootstrap: k trials of one task are one cluster'
        summary: Resample clusters, not rows, or the interval comes out far too narrow.
        kind: idea
        resources: [b8-tau-bench-passk]
        checks: [b8-clustered-bootstrap]
      - id: power-analysis
        title: Power analysis for eval set size
        summary: How many cases the difference you care about actually needs, worked out before the run.
        kind: idea
        resources: [b8-evals-faq-sample-sizes]
      - id: multiple-comparisons
        title: Multiple comparisons across failure modes and model variants
        summary: Twenty slices and one will look significant; decide the correction before you slice.
        kind: idea
        resources: [b8-statistical-model-evaluator]
      - id: cuped
        title: CUPED and variance reduction for online tests
        summary: Which extra examples actually buy precision, and how much they have to buy to halve an interval.
        kind: idea
        checks: [b8-halve-interval]
      - id: no-raw-judge-rate
        title: Never report a raw judge pass rate as a system pass rate
        summary: The corrected estimate plus an interval, or nothing that a stakeholder is allowed to quote.
        kind: idea
        resources: [b8-judgy-stats]
        checks: [b8-corrected-estimate-ci]
    resources:
      - id: b8-miller-error-bars
        title: "Evan Miller (Anthropic), Adding Error Bars to Evals"
        kind: paper
        url: https://arxiv.org/abs/2411.00640
        est_minutes: 240
      - id: b8-judgy-stats
        title: "judgy: Rogan-Gladen correction with bootstrap CIs"
        kind: repo
        url: https://github.com/ai-evals-course/judgy
        est_minutes: 120
      - id: b8-tau-bench-passk
        title: "tau-bench: pass^k as a reliability statistic"
        kind: paper
        url: https://arxiv.org/abs/2406.12045
        est_minutes: 60
      - id: b8-evals-faq-sample-sizes
        title: "Evals FAQ, sample size requirements across eval stages"
        kind: doc
        url: https://hamel.dev/blog/posts/evals-faq/
        est_minutes: 90
      - id: b8-statistical-model-evaluator
        title: "StatisticalModelEvaluator (third-party reference implementation of Miller)"
        kind: repo
        url: https://github.com/The-Swarm-Corporation/StatisticalModelEvaluator
        est_minutes: 60
    checks:
      - id: b8-corrected-estimate-ci
        module: b8
        type: numeric
        must_cover: true
        prompt: "From a judge's raw pass rate on 500 unlabelled production traces plus a 100-example human-labelled calibration set, return a corrected point estimate with a bootstrap 95% CI."
        rubric:
          - "TPR and TNR estimated from the calibration set, with their own counts shown"
          - "Rogan-Gladen applied, with the TPR + TNR > 1 validity check made explicitly"
          - "The bootstrap resamples the calibration set and the unlabelled set jointly, 5,000+ replicates"
          - "The interval is reported as percentiles of the replicate distribution, and is visibly wider than a naive binomial interval"
          - "The procedure is written as code that would run, not described"
        reference: |
          Calibration set (n=100): 85 true passes, of which the judge passes 80 (TPR = 0.941);
          15 true failures, of which the judge fails 11 (TNR = 0.733). Unlabelled: judge passes
          450/500, so p_obs = 0.90.

          ```
          TPR + TNR = 1.674 > 1                         (correction is valid)
          theta_hat = (0.90 + 0.733 - 1) / 0.674 = 0.939
          ```

          ```python
          import numpy as np
          rng = np.random.default_rng(0)

          def rogan_gladen(p_obs, tpr, tnr):
              d = tpr + tnr - 1
              return np.nan if d <= 0 else (p_obs + tnr - 1) / d

          reps = []
          for _ in range(10_000):
              cal = rng.choice(len(cal_human), len(cal_human), replace=True)  # resample CAL
              h, j = cal_human[cal], cal_judge[cal]
              tpr = (j[h == 1] == 1).mean()
              tnr = (j[h == 0] == 0).mean()
              p   = rng.choice(unlabelled, len(unlabelled), replace=True).mean()  # and TEST
              reps.append(rogan_gladen(p, tpr, tnr))

          reps = np.array(reps); reps = reps[~np.isnan(reps)]
          lo, hi = np.percentile(reps, [2.5, 97.5])   # e.g. 0.939 [0.881, 0.983]
          ```

          The naive Wilson interval on 0.90 of 500 is about ±0.026; the corrected interval is
          roughly four times wider, and almost all of that extra width comes from estimating TNR
          on only 15 negatives.
        known_prior: true
        est_minutes: 35
        draft: true
      - id: b8-halve-interval
        module: b8
        type: numeric
        must_cover: true
        prompt: "Answer, without looking anything up: how many more examples do you need to halve that interval, and of which kind?"
        rubric:
          - "Uses the 1/sqrt(n) rule: halving a CI width requires roughly 4x the sample"
          - "Identifies which sample dominates the width - here the calibration set, and specifically its negatives"
          - "Gives a concrete number of additional labels, with the arithmetic"
          - "Notes that adding unlabelled traces barely helps once p_obs is already precise"
          - "Recommends stratified labelling to raise the count of the rare class rather than uniform labelling"
        reference: |
          Interval half-width scales as `1/sqrt(n)`, so halving it needs about **4x** the sample —
          but only in the component that dominates. Decompose: the unlabelled term contributes
          `1.96 * sqrt(0.9*0.1/500) ≈ 0.026`; the calibration term enters through TNR, estimated on
          15 negatives, `1.96 * sqrt(0.733*0.267/15) ≈ 0.224`, divided by the denominator 0.674,
          so roughly 0.33. The calibration set is essentially the whole width.

          So: going from 15 to **60 labelled negatives** (4x) halves it. At the current 15%
          failure base rate, uniform labelling would need 400 total labels to find 60 negatives.
          Stratify instead — over-sample judge-flagged failures and correct for the sampling
          weights — and roughly **100-120 additional targeted labels** gets there.

          Adding unlabelled traces is nearly free and nearly useless here: going from 500 to 5,000
          shrinks the 0.026 term to 0.008 and moves the total width by about 2%.
        known_prior: true
        est_minutes: 30
        draft: true
      - id: b8-mcnemar-paired
        module: b8
        type: numeric
        must_cover: false
        prompt: "Compare two model versions on the same golden set with McNemar's test, and explain why the paired test is much tighter than comparing two independent proportions."
        rubric:
          - "Builds the 2x2 discordant table b and c from the same cases scored by both models"
          - "Applies McNemar (exact binomial for small b + c, chi-square with continuity correction otherwise)"
          - "Contrasts the paired interval with the unpaired two-proportion interval on the same data"
          - "Explains the mechanism: pairing removes per-question difficulty variance"
          - "States the design consequence: always score both systems on the identical question set"
        reference: |
          Same 180 cases, both models:

          ```
                       B pass   B fail
          A pass         140       8     (b = 8)
          A fail          17      15     (c = 17)

          discordant n = b + c = 25
          exact McNemar: P(X >= 17 | X ~ Bin(25, 0.5)) * 2 = 0.108
          delta = (17 - 8) / 180 = +0.050 in favour of B
          ```

          ```python
          from statsmodels.stats.contingency_tables import mcnemar
          mcnemar([[140, 8], [17, 15]], exact=True)
          ```

          Unpaired, the same data gives 0.872 vs 0.822 with a two-proportion 95% CI on the
          difference of roughly ±0.072 — the comparison is hopeless. Paired, only the 25 discordant
          cases carry information and the interval on the difference is about ±0.045. The mechanism
          is that per-question difficulty is a huge variance component, and pairing differences it
          out. The design consequence is absolute: score both systems on the identical question
          set, or you throw away most of your statistical power.
        known_prior: true
        est_minutes: 30
        draft: true
      - id: b8-clustered-bootstrap
        module: b8
        type: explain
        must_cover: false
        prompt: "Explain what a cluster is in an eval dataset, and what goes wrong if you bootstrap rows instead of clusters."
        rubric:
          - "Defines the cluster: the unit whose observations are correlated - a source document, a task with k trials, a conversation"
          - "Names at least two clusters that arise in this project: multiple questions from one report, k trials of one agent task"
          - "States the consequence: intervals that are fictitiously narrow, by roughly sqrt of the design effect"
          - "Gives the fix: resample whole clusters with replacement, keeping all their rows"
          - "Names the design effect / intra-cluster correlation as the quantity that says how bad it is"
        reference: |
          A cluster is any group of observations that are more like each other than like the rest
          of the data, so that they do not carry independent information. In this project there are
          two obvious ones: twenty questions drawn from a single end-of-well report (if that report
          is scanned and badly OCR'd, all twenty fail together), and five trials of one agent task
          (they share the task's difficulty). Bootstrapping rows treats each as a fresh
          observation, so the effective sample size is inflated by roughly the design effect
          `1 + (m - 1) * ICC`; with m = 5 trials and an ICC of 0.6 that is 3.4, and the interval
          comes out about 1.8x too narrow. That is how a "90% agent, ±2%" gets published. The fix
          is mechanical: resample whole clusters with replacement, keeping every row inside the
          chosen cluster, and recompute the statistic on the resampled set. Report the clustering
          unit alongside the interval.
        known_prior: true
        est_minutes: 20
        draft: true

