name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: learn/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  web:
    name: web (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: learn/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The root tsconfig is a solution file (`files: []` + project references), so
      # `tsc --noEmit` would check nothing. `tsc -b` is what actually typechecks.
      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
